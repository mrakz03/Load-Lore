name: Web check
# Builds the web page (python web/build_web.py) and opens it in headless Chromium on a PC-sized and a
# phone-sized screen (scripts/check_web.mjs): fails on a build error or any JavaScript error while it
# walks through the pages and opens a load in every category. Runs on every pull request, by hand
# (Actions tab > Web check > Run workflow), and before each release (release.yml).
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: python web/build_web.py
      - name: Install Playwright (Chromium only)
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
      - run: node scripts/check_web.mjs
