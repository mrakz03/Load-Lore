name: Build and release
# Push a tag like v1.0 to build everything and publish a GitHub Release.
# Run manually (Actions tab > Run workflow) to just build the files without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Set version from tag
        shell: bash
        run: |
          v=dev; [[ "$GITHUB_REF" == refs/tags/v* ]] && v="${GITHUB_REF_NAME#v}"
          # release files carry the version: LoadLore-v1.7.4-dev-Setup.exe (LoadLore-dev-... untagged)
          if [ "$v" = dev ]; then echo "VTAG=dev" >> "$GITHUB_ENV"; else echo "VTAG=v$v" >> "$GITHUB_ENV"; fi
          sed -i "s/^APP_VERSION = .*/APP_VERSION = \"$v\"/" src/load_lore.py
          grep -q "^APP_VERSION = \"$v\"" src/load_lore.py
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --windowed --name LoadLore --icon assets/icon.ico --add-data "assets/icon.png:." src/load_lore.py
      - run: |
          mkdir LoadLore
          copy dist\LoadLore.exe LoadLore\
          copy data\*.csv LoadLore\
          copy LICENSE LoadLore\LICENSE.txt
          copy LEGAL.md LoadLore\
          powershell Compress-Archive -Path LoadLore -DestinationPath LoadLore-%VTAG%-Windows.zip
        shell: cmd
      - run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_NAME -like 'v*') { $env:GITHUB_REF_NAME.Substring(1) } else { '0.0-dev' }
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}", "$env:ProgramFiles" -Filter ISCC.exe -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc.FullName "/DAppVersion=$v" scripts\windows_installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item dist\LoadLore-Setup.exe "LoadLore-$env:VTAG-Setup.exe"
          # LEGACY: v1.7.3-dev and older update only from this name. Drop once those copies are updated.
          Copy-Item dist\LoadLore-Setup.exe CartridgeCalculator-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            LoadLore-${{ env.VTAG }}-Windows.zip
            LoadLore-${{ env.VTAG }}-Setup.exe
            CartridgeCalculator-Setup.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Set version from tag
        shell: bash
        run: |
          v=dev; [[ "$GITHUB_REF" == refs/tags/v* ]] && v="${GITHUB_REF_NAME#v}"
          # release files carry the version: LoadLore-v1.7.4-dev-Setup.exe (LoadLore-dev-... untagged)
          if [ "$v" = dev ]; then echo "VTAG=dev" >> "$GITHUB_ENV"; else echo "VTAG=v$v" >> "$GITHUB_ENV"; fi
          sed -i "s/^APP_VERSION = .*/APP_VERSION = \"$v\"/" src/load_lore.py
          grep -q "^APP_VERSION = \"$v\"" src/load_lore.py
      - run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --windowed --name LoadLore --add-data "assets/icon.png:." src/load_lore.py
      - run: |
          mkdir LoadLore
          cp dist/LoadLore data/*.csv assets/icon.png LICENSE LEGAL.md LoadLore/
          cp scripts/install_linux.sh LoadLore/install.sh
          tar czf "LoadLore-$VTAG-Linux.tar.gz" LoadLore
          # LEGACY: v1.7.3-dev and older update only from this name, and look for
          # CartridgeCalculator/CartridgeCalculator inside. Drop once those copies are updated.
          cp -r LoadLore CartridgeCalculator && mv CartridgeCalculator/LoadLore CartridgeCalculator/CartridgeCalculator
          tar czf CartridgeCalculator-Linux.tar.gz CartridgeCalculator
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            LoadLore-${{ env.VTAG }}-Linux.tar.gz
            CartridgeCalculator-Linux.tar.gz

  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_DEBUG_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Set version from tag
        shell: bash
        run: |
          v=dev; [[ "$GITHUB_REF" == refs/tags/v* ]] && v="${GITHUB_REF_NAME#v}"
          # release files carry the version: LoadLore-v1.7.4-dev-Setup.exe (LoadLore-dev-... untagged)
          if [ "$v" = dev ]; then echo "VTAG=dev" >> "$GITHUB_ENV"; else echo "VTAG=v$v" >> "$GITHUB_ENV"; fi
          sed -i "s/^APP_VERSION = .*/APP_VERSION = \"$v\"/" src/load_lore.py
          grep -q "^APP_VERSION = \"$v\"" src/load_lore.py
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: python web/build_web.py
      - run: npm install
      - run: npx cap add android
      - name: App icon (made by scripts/make_icons.py)
        run: cp -r assets/android/res/. android/app/src/main/res/
      - run: npx cap sync android
      - name: Stamp version into the APK
        shell: bash
        run: |
          v=$(sed -n 's/^APP_VERSION = "\(.*\)".*/\1/p' src/load_lore.py)
          f=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$v\"/" $f
          grep -q "versionName \"$v\"" $f || echo "::warning::could not set the APK version in $f"
      - name: Sign with the saved key (so updates install over the old app)
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::No ANDROID_DEBUG_KEYSTORE secret, so this APK gets a new key and won't install over an older one."
            exit 0
          fi
          # Gradle's default debug keystore location depends on the runner's environment, so name
          # the key outright (android.injected.signing.* applies to debug builds too)
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          echo "SIGN_ARGS=-Pandroid.injected.signing.store.file=$RUNNER_TEMP/debug.keystore -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=androiddebugkey -Pandroid.injected.signing.key.password=android" >> "$GITHUB_ENV"
      - run: ./gradlew assembleDebug $SIGN_ARGS
        working-directory: android
      - name: Check the APK was signed with the saved key
        if: ${{ env.HAS_KEY == 'true' }}
        shell: bash
        run: |
          want=$(keytool -list -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android | grep -m1 'SHA256:' | awk '{print $2}')
          got=$(keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -m1 'SHA256:' | awk '{print $2}')
          echo "keystore $want"; echo "apk      $got"
          [ -n "$want" ] && [ "$want" = "$got" ]
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk "LoadLore-$VTAG.apk"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: "LoadLore-${{ env.VTAG }}.apk" }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Checksums (the in-app updater won't install a download that doesn't match)
        working-directory: out
        run: sha256sum LoadLore-* CartridgeCalculator-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/LoadLore-*
            out/CartridgeCalculator-*
            out/SHA256SUMS.txt
