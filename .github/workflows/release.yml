name: Build and release
# Push a tag like v1.0 to publish a GitHub Release; the website deploys after it (pages.yml).
# The web check (check.yml) runs first, so a broken build is never released. Windows / Linux builds
# ended with v1.14.x (Nov 2026; the desktop branch keeps them), the Android app in Nov 2026 (
# the android branch keeps it). Run manually (Actions tab > Run workflow) to just run the check.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    uses: ./.github/workflows/check.yml

  release:
    # The release holds no files (the app is the website). It marks the version and starts
    # pages.yml, which deploys loadlore.net.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
