name: Build and release
# Push a tag like v1.0 to build everything and publish a GitHub Release.
# Run manually (Actions tab > Run workflow) to just build the files without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --windowed --name CartridgeCalculator cartridge_calculator.py
      - run: |
          mkdir CartridgeCalculator
          copy dist\CartridgeCalculator.exe CartridgeCalculator\
          copy ammo_*.csv CartridgeCalculator\
          powershell Compress-Archive -Path CartridgeCalculator -DestinationPath CartridgeCalculator-Windows.zip
        shell: cmd
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: CartridgeCalculator-Windows.zip }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --windowed --name CartridgeCalculator cartridge_calculator.py
      - run: |
          mkdir CartridgeCalculator
          cp dist/CartridgeCalculator ammo_*.csv CartridgeCalculator/
          tar czf CartridgeCalculator-Linux.tar.gz CartridgeCalculator
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: CartridgeCalculator-Linux.tar.gz }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: python build_web.py
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk CartridgeCalculator.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: CartridgeCalculator.apk }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/CartridgeCalculator-Windows.zip
            out/CartridgeCalculator-Linux.tar.gz
            out/CartridgeCalculator.apk
