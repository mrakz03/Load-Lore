name: Build Windows exe
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --windowed --name CartridgeCalculator cartridge_calculator.py
      - run: |
          mkdir CartridgeCalculator
          copy dist\CartridgeCalculator.exe CartridgeCalculator\
          copy ammo_*.csv CartridgeCalculator\
        shell: cmd
      - uses: actions/upload-artifact@v4
        with: { name: CartridgeCalculator, path: CartridgeCalculator }
