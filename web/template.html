<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<title>Cartridge Value Calculator</title>
<style>
:root{--bg:#0e1014;--surface:#171a21;--surface2:#222732;--border:#2d333f;--text:#e8eaee;--muted:#8a93a3;--accent:#4c8dff;--accent-h:#6aa0ff;--on-accent:#fff;--side:#12151b;--danger:#e5534b;--hand:#5fd1b4;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(16px * var(--ts,1))}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{font-size:1rem}
body{padding:max(16px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
.wrap{max-width:640px;margin:0 auto}
.main{min-width:0}
.wrap.wide{max-width:1000px}

.shell{max-width:1240px;margin:0 auto}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}
.brand b{font-size:1.05rem;letter-spacing:.01em}
.brand .ver{font-size:.72rem;color:var(--muted);margin-top:2px}
.sizebox{display:none}
.nav{display:flex;gap:4px}
.nav>button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-weight:700;font-size:.74rem;padding:7px 4px 6px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px}
.nav>button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav>button.on{color:var(--on-accent);background:var(--accent)}
.nav .sub{display:none}
.cmp{display:none;font-style:normal}
.side{display:contents}
.side .nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--side);border-top:1px solid var(--border);padding:6px 10px calc(6px + env(safe-area-inset-bottom));border-radius:14px 14px 0 0}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.phead{margin-bottom:12px}
.phead h2{margin:0}
.back{padding:0 0 6px;font-size:.88rem}
.hero{margin:4px 0 18px}
.hero h2{font-size:1.7rem;line-height:1.2;margin:0}
.hero p{color:var(--muted);margin:8px 0 0;line-height:1.5}
.feat{display:grid;grid-template-columns:1fr;gap:12px}
.fcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:8px;text-align:left;color:var(--text);font:inherit;cursor:pointer}
.fcard:hover{border-color:var(--accent);background:var(--surface2)}
.fcard .ic{width:40px;height:40px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center}
.fcard .ic svg{width:22px;height:22px;stroke:var(--on-accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fcard b{font-size:1.15rem}.fcard span{color:var(--muted);font-size:.92rem;line-height:1.45}
.pick{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:560px){.feat,.pick{grid-template-columns:1fr 1fr}}
@media(min-width:900px){
  body{padding:0}
  .shell{display:grid;grid-template-columns:240px minmax(0,1fr);max-width:none;min-height:100vh}
  .side{display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;padding:22px 14px;background:var(--side);border-right:1px solid var(--border);overflow:auto}
  .side .brand{margin:0 6px}.side .brand .size{display:none}
  .side .nav{position:static;flex-direction:column;background:none;border:0;padding:0;gap:4px;border-radius:0}
  .nav>button{flex:none;flex-direction:row;justify-content:flex-start;align-items:center;gap:12px;font-size:.95rem;padding:11px 12px;min-height:0;text-align:left}
  .cmp{display:inline}
  .nav .sub{display:flex;flex-direction:column;gap:2px;margin:0 0 8px 24px;border-left:1px solid var(--border);padding-left:8px}
  .nav .sub button{background:none;border:0;color:var(--muted);font:inherit;font-size:.88rem;text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer}
  .nav .sub button:hover{background:var(--surface)}
  .nav .sub button.on{color:var(--text);background:var(--surface2);font-weight:700}
  .sizebox{display:block;margin-top:auto;padding:0 6px}
  .main{padding:26px 34px 48px;min-width:0}
  .wrap.wide{max-width:1040px}.wrap{margin:0}
  .wrap.home{max-width:760px}
}
.lgrid{align-items:start;display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px}
@media(min-width:720px){.lgrid{grid-template-columns:1fr 1fr}}
.lc{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;cursor:pointer}
.lc.open{border-color:var(--accent)}
.lc .top{display:flex;gap:10px;align-items:flex-start}
.lc .rk{font-weight:800;color:var(--muted);min-width:2.2em;font-size:.9rem;padding-top:2px}
.lc .nm{flex:1;min-width:0;font-weight:700;line-height:1.3;word-break:break-word}
.lc .st{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0 0 calc(2.2em + 10px);font-size:.85rem;color:var(--muted)}
.lc .st b{color:var(--text);font-weight:600}
.lc .nm .wt{white-space:nowrap}
.lc .sc{text-align:right;white-space:nowrap}.lc .sc .n{font-size:.75rem;color:var(--muted);display:block;margin-top:2px}
.lc .det{margin:10px 0 0;border-top:1px solid var(--border);padding-top:8px}
.lc .det .row{padding:4px 0}
.chip{display:inline-block;font-size:.68rem;font-weight:700;color:var(--accent);border:1px solid var(--border);border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.prow{display:flex;gap:8px;align-items:center;margin-top:8px}.prow input{max-width:7.5em}
.prow .btn{padding:9px 12px;font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chips button{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:99px;padding:8px 13px;font:inherit;font-size:.85rem;font-weight:700;cursor:pointer;min-height:38px}
.chips button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chips button small{opacity:.75;font-weight:600;margin-left:3px}
.sortrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
@media(max-width:480px){.sortrow{grid-template-columns:1fr}}

h1{font-size:1.45rem;margin:0}
h2{font-size:1.45rem;margin:6px 0 0}
.muted{color:var(--muted)}
.sub{color:var(--muted);margin:4px 0 18px;font-size:.95rem}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}
.cat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:left;color:var(--text);cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:6px;min-height:118px}
.cat:hover,.cat:active{background:var(--surface2);border-color:var(--accent)}
.cat b{font-size:1.1rem}.cat span.b{color:var(--muted);font-size:.85rem}.cat span.c{color:var(--accent);font-size:.78rem;font-weight:700;margin-top:auto}
.link{background:none;border:0;color:var(--accent);font:inherit;font-weight:700;font-size:.9rem;padding:6px 0;cursor:pointer}
.link.m{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
label.l{display:block;font-size:.7rem;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:0 0 5px}
select,input{width:100%;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:11px 10px;font:inherit;font-size:1rem;appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
select:focus,input:focus{outline:none;border-color:var(--accent)}
.field{margin-top:14px}.field:first-child{margin-top:0}
.nums>div,.three>div,.wrow>div{min-width:0}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.nums label.l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.links{display:flex;justify-content:space-between;margin-top:10px}
.weights{margin-top:8px}
.wrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(5.4em,1fr));gap:8px}
.wrow label{font-size:.8rem;color:var(--muted)}
.wnote{font-size:.8rem;font-weight:700;margin-top:8px}
.btns{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
button.btn{background:var(--surface2);color:var(--text);border:0;border-radius:8px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer}
button.btn:hover{background:var(--border)}
button.btn.p{background:var(--accent);color:var(--on-accent)}button.btn.p:hover{background:var(--accent-h)}
.hidden{display:none!important}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.size{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted)}
.size button{background:var(--surface2);color:var(--text);border:0;border-radius:6px;font:inherit;font-weight:800;min-width:40px;min-height:36px;cursor:pointer}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
@media(max-width:480px){.filters{grid-template-columns:1fr}}
.cnt{font-size:.8rem;color:var(--muted);margin-top:8px}
tbody tr{cursor:pointer}tbody tr:hover td{background:var(--surface2)}
.rank{font-size:.9rem;margin-top:8px;line-height:1.45}
.res{margin-top:16px}
.res h3{margin:0;font-size:1.05rem}
.row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;gap:10px}
.row .v{font-weight:700;margin-left:auto}
.badge{min-width:32px;text-align:center;border-radius:6px;font-weight:800;font-size:.85rem;padding:3px 6px}
hr{border:0;border-top:1px solid var(--border);margin:10px 0}
.bar{height:12px;background:var(--surface2);border-radius:6px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;border-radius:6px;transition:width .3s}
.note{font-size:.78rem;color:var(--muted);line-height:1.45;margin-top:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px;z-index:10}
.modal .card{width:100%;max-width:640px;margin:auto}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.help{font-size:.78rem;color:var(--muted);margin-top:4px;line-height:1.4}
.tblwrap .pc{display:none}
@media (max-width:600px){   /* phone: cartridge stacks over the load name; other figures are one tap away */
  .tblwrap .mn{display:none}
  .tblwrap .pc{display:block;font-size:.75rem;color:var(--muted)}
  .tblwrap .ld{white-space:normal;text-align:left}
}
.tblwrap{overflow:auto;margin-top:12px;border:1px solid var(--border);border-radius:8px;max-height:65vh}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{padding:8px 10px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--border)}
th{position:sticky;top:0;background:var(--surface2);cursor:pointer;font-size:.78rem}
td:nth-child(-n+2),th:nth-child(-n+2){text-align:left}
td:nth-child(1),th:nth-child(1){position:sticky;left:0;background:var(--surface)}
th:nth-child(1){background:var(--surface2);z-index:2}
.g2,.g3{display:grid;gap:8px;margin-top:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.g2>div,.g3>div{min-width:0}
@media(max-width:340px){.g3{grid-template-columns:1fr 1fr}}
.lc.hl{border-left:3px solid var(--accent)}
.hbtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.hbtns .btn{padding:9px 14px;font-size:.85rem}
.hbtns .btn.d{color:var(--danger)}
.look{display:flex;align-items:center;gap:10px;margin-top:22px}.look select{max-width:240px}
.safety{font-size:.78rem;color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-top:14px;line-height:1.4}
.costlbl{font-weight:700;margin-top:10px}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><div><b>Cartridge Calculator</b><div class="ver" id="ver"></div></div><div id="size1"></div></div>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <div class="sizebox" id="size2"></div>
  </aside>
  <main class="main">
    <div class="wrap" id="app"></div>
  </main>
</div>
<script>
"use strict";
const DATA = __DATA__;
const APP_TITLE = "Cartridge Value Calculator";
// ---------- colour themes (same table as the desktop app) ----------
const THEMES = DATA.themes || {}, THEME_KEY = "cartridge_calc_theme";
const THEME_VARS = {bg:"--bg",surface:"--surface",surface_2:"--surface2",border:"--border",text:"--text",muted:"--muted",
  accent:"--accent",accent_hover:"--accent-h",on_accent:"--on-accent",side:"--side",danger:"--danger",hand:"--hand"};
let THEME = DATA.default_theme || "Classic";
try{const t=localStorage.getItem(THEME_KEY);if(t&&THEMES[t])THEME=t;}catch(e){}
function applyTheme(name){
  const t=THEMES[name];if(!t)return;THEME=name;
  const st=document.documentElement.style;
  for(const [k,v] of Object.entries(THEME_VARS))st.setProperty(v,t[k]);
  st.colorScheme=t.scheme;
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t.side;
  try{localStorage.setItem(THEME_KEY,name);}catch(e){}
}
applyTheme(THEME);
const VERSION_TEXT = DATA.version && DATA.version !== "dev" ? "Development Build v" + DATA.version : "Development Build";
const GRAINS_PER_OZ = 437.5;
const GRADE_BANDS = [[72.5,"S"],[70.5,"A"],[66,"B"],[61,"C"],[55,"D"]];
const METRICS = {velocity:["Velocity",true],energy:["Energy",true],recoil:["Recoil",false],cost:["Cost",false],taylor:["Taylor KO",true],hits:["HITS",true]};
const TERMINAL=["taylor","hits"];
const keysOf=cat=>cat.terminal?MKEYS:MKEYS.filter(k=>!TERMINAL.includes(k));
const DIAMETERS=DATA.diameters;
const MKEYS = Object.keys(METRICS);
const TYPICAL_SCORE = 70.0;
const HIGH_K = -Math.log(1 - TYPICAL_SCORE/100), LOW_K = -Math.log(TYPICAL_SCORE/100);
const GRADE_COLORS = {S:["#a98bff","#1b0a40"],A:["#2fbf71","#06210f"],B:["#4c8dff","#06152e"],C:["#e5b93c","#2b2005"],D:["#e98a3c","#2e1704"],F:["#e5534b","#2e0a08"]};
const SOURCE_NOTES = {
  catalog:"Weight and velocity come from the manufacturer's 2026 catalog. The ballistic coefficient is the catalog's own figure or is worked out from its published downrange velocities; powder charge (recoil) and price are estimated.",
  published:"Weight, velocity and ballistic coefficient are manufacturer-published; powder charge (used for recoil) is estimated.",
  partial:"Weight and velocity are manufacturer-published; ballistic coefficient and powder charge are estimated.",
  custom:"Your own entry. Anything you left blank was estimated.",
  typical:"Typical factory-load figures from published specs; approximate, so check the box.",
  handload:"Your own handload. Check every figure against a published load manual."};
const DEFAULT_SOURCE_NOTE = "Load data is approximate. Check it against the box or the manufacturer.";
const REL_CENTER=70, REL_SPREAD=10, REL_BANDS=[[85,"S"],[77,"A"],[66,"B"],[55,"C"],[45,"D"]];
// saved data may use cartridge names from before a rename (e.g. "7.62x54R" -> "7.62x54mmR")
const RENAMED = DATA.renamed || {};
const canon = n => RENAMED[n] || n;
const canonRows = a => (Array.isArray(a) ? a : []).map(r => r && typeof r === "object" && r.cartridge ? {...r, cartridge: canon(r.cartridge)} : r);
const PRICE_KEY = "cartridge_calc_prices_v1";
const CUSTOM_KEY = "cartridge_calc_custom_v1";

const CATEGORIES = DATA.categories;   // title, blurb, distances, labels, flags, weights, loads
const G1 = [[0,.2629],[.05,.2558],[.1,.2487],[.15,.2413],[.2,.2344],[.25,.2278],[.3,.2214],[.35,.2155],[.4,.2104],[.45,.2061],[.5,.2032],[.55,.202],[.6,.2034],[.7,.2165],[.725,.223],[.75,.2313],[.775,.2417],[.8,.2546],[.825,.2706],[.85,.2901],[.875,.3136],[.9,.3415],[.925,.3734],[.95,.4084],[.975,.4448],[1,.4805],[1.025,.5136],[1.05,.5427],[1.075,.5677],[1.1,.5883],[1.125,.6053],[1.15,.6191],[1.2,.6393],[1.25,.6518],[1.3,.6589],[1.35,.6621],[1.4,.6625],[1.45,.6607],[1.5,.6573],[1.55,.6528],[1.6,.6474],[1.65,.6413],[1.7,.6347],[1.75,.628],[1.8,.621],[1.85,.6141],[1.9,.6072],[1.95,.6003],[2,.5934],[2.05,.5867],[2.1,.5804],[2.15,.5743],[2.2,.5685],[2.25,.563],[2.3,.5577],[2.35,.5527],[2.4,.5481],[2.45,.5438],[2.5,.5397],[2.6,.5325],[2.7,.5264],[2.8,.5211],[2.9,.5168],[3,.5133],[3.1,.5105],[3.2,.5084],[3.3,.5067],[3.4,.5054],[3.5,.504],[3.6,.503],[3.7,.5022],[3.8,.5016],[3.9,.501],[4,.5006],[4.2,.4998],[4.4,.4995],[4.6,.4992],[4.8,.499],[5,.4988]];
const FT_PER_M=3.280839895, YD_PER_M=1.093613298, SOS=340.3, RHO=1.225, LBIN2=703.0696;
const KDRAG = RHO*Math.PI/(8*LBIN2);

// ---------- helpers ----------
const $ = (s,r=document)=>r.querySelector(s);
const esc = s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function g(n){return String(+(+n).toPrecision(6));}          // like Python's :g
function el(html){const t=document.createElement("template");t.innerHTML=html.trim();return t.content.firstChild;}

// ---------- ballistics ----------
function g1cd(m){
  if(m<=G1[0][0])return G1[0][1];
  const last=G1[G1.length-1]; if(m>=last[0])return last[1];
  let lo=0,hi=G1.length;                       // bisect_right
  while(lo<hi){const mid=(lo+hi)>>1; if(m<G1[mid][0])hi=mid; else lo=mid+1;}
  const [m0,c0]=G1[lo-1],[m1,c1]=G1[lo];
  return c0+(c1-c0)*(m-m0)/(m1-m0);
}
function velocityAt(fps,bc,distYd){
  if(distYd<=0)return +fps;
  let v=fps/FT_PER_M; const total=distYd/YD_PER_M, step=0.5; let x=0;
  const dvdx=s=>-KDRAG*g1cd(s/SOS)*s/bc;
  while(x<total && v>1){
    const h=Math.min(step,total-x), k1=dvdx(v), k2=dvdx(v+0.5*h*k1);
    v+=h*k2; x+=h;
  }
  return Math.max(v,0)*FT_PER_M;
}
const energy=(gr,v)=>gr*v*v/450240;
function recoil(gr,fps,powder,gun){
  const mom=(gr*fps+1.75*powder*4000)/7000, gv=mom/gun;
  return 0.5*(gun/32.174)*gv*gv;
}
const estimatePowder=(gr,fps)=>Math.max(0.3,energy(gr,fps)/60);

// ---------- scoring ----------
function bulletDiameter(it){
  if(it.diameter_in)return it.diameter_in;
  const d=DIAMETERS[it.cartridge];if(d)return d;
  const n=it.cartridge.toLowerCase();if(n.includes("gauge")||n.includes("bore"))return 0;
  return Math.min(.6,Math.max(.17,Math.sqrt(it.bullet_gr/7000/.25)));
}
const taylorKO=(gr,v,d)=>gr*v*d/7000;
const hitsIndex=(gr,v,d)=>d<=0?0:(gr*gr/7000)*(v/(d*d))/100;
const hitsClass=h=>h<500?"small game":h<=900?"medium game":h<=1500?"large game":"dangerous game";
function computeStats(item,dist,gun,cost){
  const v=velocityAt(item.muzzle_fps,item.bc_g1,dist),d=bulletDiameter(item);
  return {weight:item.bullet_gr,velocity:v,energy:energy(item.bullet_gr,v),
          taylor:taylorKO(item.bullet_gr,v,d),hits:hitsIndex(item.bullet_gr,v,d),
          recoil:recoil(item.bullet_gr,item.muzzle_fps,item.powder_gr,gun),
          cost:cost==null?item.default_cost:cost};
}
function median(a){const s=[...a].sort((x,y)=>x-y),n=s.length;return n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2;}
function referenceLevels(loads,dist,gun){
  const st=loads.map(x=>computeStats(x,dist,gun)); const r={};
  for(const k of MKEYS)r[k]=median(st.map(s=>s[k])); return r;
}
function gradeFor(score){for(const [t,l] of GRADE_BANDS)if(score>=t)return l;return "F";}
function metricScore(value,ref,hi){
  if(ref<=0)return 50;
  const x=Math.max(value,0)/ref;
  return hi?100*(1-Math.exp(-HIGH_K*x)):100*Math.exp(-LOW_K*x);
}
function scoreStats(stats,refs,weights){
  const scores={}; for(const k of MKEYS)scores[k]=metricScore(stats[k],refs[k],METRICS[k][1]);
  let tot=MKEYS.reduce((a,k)=>a+weights[k],0), w=weights;
  if(tot<=0){w=Object.fromEntries(MKEYS.map(k=>[k,1]));tot=MKEYS.length;}
  return [scores, MKEYS.reduce((a,k)=>a+scores[k]*w[k],0)/tot];
}

function gradeRel(score){for(const [t,l] of REL_BANDS)if(score>=t)return l;return "F";}
function spread(vals){
  const n=vals.length; let mid=median(vals);
  let scale=1.4826*median(vals.map(v=>Math.abs(v-mid)));
  if(scale<1e-9){
    const mean=vals.reduce((a,b)=>a+b,0)/n;
    scale=n>1?Math.sqrt(vals.reduce((a,v)=>a+(v-mean)*(v-mean),0)/n):0; mid=mean;
  }
  if(scale<1e-9)return vals.map(()=>REL_CENTER);
  return vals.map(v=>Math.min(100,Math.max(0,REL_CENTER+REL_SPREAD*(v-mid)/scale)));
}
function relativeScores(statsList,weights){
  if(!statsList.length)return [];
  const refs={},per={};
  for(const k of MKEYS)refs[k]=median(statsList.map(s=>s[k]));
  for(const k of MKEYS)per[k]=spread(statsList.map(s=>metricScore(s[k],refs[k],METRICS[k][1])));
  let w=weights,tot=MKEYS.reduce((a,k)=>a+w[k],0);
  if(tot<=0){w=Object.fromEntries(MKEYS.map(k=>[k,1]));tot=MKEYS.length;}
  const raw=statsList.map((_,i)=>MKEYS.reduce((a,k)=>a+per[k][i]*w[k],0)/tot);
  const overall=spread(raw);
  return statsList.map((_,i)=>[Object.fromEntries(MKEYS.map(k=>[k,per[k][i]])),overall[i]]);
}

function readPrices(){try{const o=JSON.parse(localStorage.getItem(PRICE_KEY)||"{}")||{},out={};for(const [k,v] of Object.entries(o)){const p=k.split("|");if(p.length>=3){p[1]=canon(p[1]);const r=p.slice(2).join("|"),m=/^(\d+(?:\.\d+)?) gr  ·  (.+)$/.exec(r);p.length=2;p.push(m?`${m[2]}  ·  ${m[1]} gr`:r);}out[p.join("|")]=v;}return out;}catch(e){return {};}}

// cartridges in Compare Cartridges with no factory loads (e.g. .32-40) still get an empty entry,
// after the cartridge they follow there, so handloaders can use Compare Loads for them
function withHandloadOnly(groups,cartLoads){
  const order=[...new Set(cartLoads.map(x=>x.cartridge))];
  if(order.every(c=>groups.has(c)))return groups;
  let keys=[...groups.keys()];
  order.forEach((c,i)=>{if(keys.includes(c))return;const prev=order.slice(0,i).reverse().find(p=>keys.includes(p));const at=prev?keys.indexOf(prev)+1:0;keys.splice(at,0,c);});
  return new Map(keys.map(k=>[k,groups.get(k)||[]]));
}
function groupBy(loads,sort){
  const m=new Map();
  for(const it of loads){if(!m.has(it.cartridge))m.set(it.cartridge,[]);m.get(it.cartridge).push(it);}
  if(sort)for(const a of m.values())a.sort((x,y)=>x.bullet_gr-y.bullet_gr||(x.load<y.load?-1:x.load>y.load?1:0));
  return m;
}

  const [m,close]=modal(`

    <label class="l" style="margin-top:12px">CARTRIDGE</label><input id="hc" list="hcl" autocomplete="off"><datalist id="hcl">${cartList.map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
    <div class="g2"><div><label class="l">BULLET MAKER</label><select id="hbm"></select></div><div><label class="l">BULLET (LIBRARY)</label><select id="hbl"></select></div></div>
    <div class="g2"><div><label class="l">BULLET NAME</label><input id="hbn" autocomplete="off" placeholder="e.g. ELD-M"></div><div><label class="l">LOAD NAME (OPTIONAL)</label><input id="hn" autocomplete="off"></div></div>
    <div class="g3"><div><label class="l">WEIGHT (GR)</label><input id="hgr" inputmode="decimal"></div><div><label class="l">DIAMETER (IN)</label><input id="hdm" inputmode="decimal"></div><div><label class="l">BC (G1)</label><input id="hbc" inputmode="decimal"></div></div>
    <div class="g2"><div><label class="l">POWDER</label><input id="hpw" list="hpl" autocomplete="off"><datalist id="hpl">${POWDERS.map(c=>`<option value="${esc(c)}">`).join("")}</datalist></div><div><label class="l">CHARGE (GR)</label><input id="hpg" inputmode="decimal"></div></div>
    <div class="g3"><div><label class="l">VELOCITY (FPS)</label><input id="hfps" inputmode="decimal"></div><div><label class="l">BARREL (IN)</label><input id="hbl2" inputmode="decimal"></div><div><label class="l">PURPOSE</label><select id="hpu">${PURPOSES.map(x=>`<option>${x}</option>`).join("")}</select></div></div>
    <label class="l" style="margin-top:16px">COST (OPTIONAL BREAKDOWN)</label>
    <div class="g3"><div><label class="l">BULLET $ EACH</label><input id="hcb" inputmode="decimal"></div><div><label class="l">POWDER $ / LB</label><input id="hcp" inputmode="decimal"></div><div><label class="l">PRIMER $ EACH</label><input id="hcr" inputmode="decimal"></div></div>
    <div class="g3"><div><label class="l">BRASS $ EACH</label><input id="hcs" inputmode="decimal"></div><div><label class="l">BRASS REUSES</label><input id="hcu" inputmode="decimal"></div><div><label class="l">OR TOTAL $ / ROUND</label><input id="hct" inputmode="decimal"></div></div>
    <div class="costlbl" id="hcost"></div>
    <label class="l" style="margin-top:14px">NOTES</label><input id="hno" autocomplete="off">
    <div class="safety">Handload figures are only as good as your data. Always follow published load manuals; this app doesn't check pressure or safety.</div>
    <div class="btns"><button class="btn p" id="hsave">${edit?"Save changes":"Save handload"}</button><button class="btn" id="hcancel">Cancel</button></div>`);
  const q=x=>$(x,m);
  const diaOf=c=>DIAMETERS[c.trim()]||0;
  const val=(id,v)=>{q("#"+id).value=v==null||v===0||v===""?"":v;};
  const fillMakers=()=>{
    const d=diaOf(q("#hc").value),list=BULLETS.filter(b=>!d||Math.abs(b.diameter-d)<=0.003);
    const makers=[...new Set(list.map(b=>b.maker))].sort(),cur=q("#hbm").value;
    q("#hbm").innerHTML=`<option value="">Other / custom</option>`+makers.map(x=>`<option>${esc(x)}</option>`).join("");
    q("#hbm").value=makers.includes(cur)?cur:(cur&&cur!=="" ? "" : "");
    fillBullets();
  };
  const fillBullets=()=>{
    const d=diaOf(q("#hc").value),mk=q("#hbm").value;
    const list=BULLETS.filter(b=>mk&&b.maker===mk&&(!d||Math.abs(b.diameter-d)<=0.003));
    q("#hbl").innerHTML=`<option value="">${mk?"Choose a bullet…":"—"}</option>`+list.map((b,i)=>`<option value="${BULLETS.indexOf(b)}">${esc(b.name)} · ${g(b.weight)} gr</option>`).join("");
  };
  const showCost=()=>{
    const t=parseFloat(q("#hct").value);let c;
    if(t>0)c=t;else c=costParts({bullet_cost:q("#hcb").value,powder_gr:q("#hpg").value,powder_cost_lb:q("#hcp").value,primer_cost:q("#hcr").value,brass_cost:q("#hcs").value,brass_reuse:q("#hcu").value||5}).total;
    q("#hcost").textContent=c>0?`Cost per round = $${c.toFixed(2)}`:"";
  };
  q("#hc").addEventListener("input",fillMakers);q("#hc").addEventListener("change",fillMakers);
  q("#hbm").onchange=fillBullets;
  q("#hbl").onchange=()=>{const b=BULLETS[+q("#hbl").value];if(!b)return;q("#hbn").value=b.name;q("#hgr").value=g(b.weight);q("#hdm").value=g(b.diameter);q("#hbc").value=g(b.bc);};
  ["hcb","hcp","hcr","hcs","hcu","hct","hpg"].forEach(i=>q("#"+i).addEventListener("input",showCost));
  // prefill
  val("hc",rec.cartridge);fillMakers();
  if(rec.bullet_maker&&[...q("#hbm").options].some(o=>o.value===rec.bullet_maker)){q("#hbm").value=rec.bullet_maker;fillBullets();}
  val("hbn",rec.bullet);val("hn",rec.name);val("hgr",rec.bullet_gr);val("hdm",rec.diameter_in);val("hbc",rec.bc_g1);
  val("hpw",rec.powder);val("hpg",rec.powder_gr);val("hfps",rec.muzzle_fps);val("hbl2",rec.barrel_in);
  q("#hpu").value=rec.purpose||"Hunting";
  val("hcb",rec.bullet_cost);val("hcp",rec.powder_cost_lb);val("hcr",rec.primer_cost);val("hcs",rec.brass_cost);q("#hcu").value=rec.brass_reuse||5;
  const hasParts=+rec.bullet_cost||+rec.powder_cost_lb||+rec.primer_cost||+rec.brass_cost;
  if(rec.cost&&!hasParts)val("hct",rec.cost);
  val("hno",rec.notes);showCost();
  q("#hcancel").onclick=close;
  q("#hsave").onclick=()=>{
    let r;
    try{
      const num=(id,label,lo,hi,blank)=>{
        const t=q("#"+id).value.trim().replace("$","");
        if(!t){if(blank)return null;throw new Error(`${label} is required.`);}
        const v=Number(t);if(!isFinite(v))throw new Error(`${label} must be a number.`);
        if(v<lo||(hi!=null&&v>hi))throw new Error(`${label} must be ${hi!=null?`between ${g(lo)} and ${g(hi)}`:`${g(lo)} or more`}.`);
        return v;};
      const cart=q("#hc").value.trim();if(!cart)throw new Error("Enter a cartridge.");
      const gr=num("hgr","Bullet weight",1,2000),fps=num("hfps","Velocity",100,5500),pg=num("hpg","Powder charge",0.1,300);
      let dm=num("hdm","Diameter",0.1,0.7,true);if(dm==null)dm=DIAMETERS[cart]||bulletDiameter({cartridge:cart,bullet_gr:gr});
      let bc=num("hbc","Ballistic coefficient",0.01,1.5,true);
      if(bc==null)bc=+(gr/7000/(dm*dm)*(cat.title==="Handgun"?0.95:1.7)).toFixed(3);
      const bl=num("hbl2","Barrel length",1,60,true);
      const parts={bullet_cost:num("hcb","Bullet cost",0,null,true)||0,powder_cost_lb:num("hcp","Powder cost",0,null,true)||0,primer_cost:num("hcr","Primer cost",0,null,true)||0,brass_cost:num("hcs","Brass cost",0,null,true)||0,brass_reuse:num("hcu","Brass reuses",1,1000,true)||5};
      const tot=num("hct","Total cost",0,null,true);
      const cost=tot>0?tot:costParts(Object.assign({powder_gr:pg},parts)).total;
      if(!(cost>0))throw new Error("Enter a cost per round (a total, or the bullet, powder, primer and brass prices).");
      const mk=q("#hbm").value,bn=q("#hbn").value.trim(),pw=q("#hpw").value.trim();
      let name=q("#hn").value.trim();
      if(!name)name=[mk,bn,g(gr)+" gr"].filter(Boolean).join(" ")+(pw?` + ${pw} ${g(pg)} gr`:` + ${g(pg)} gr`);
      r=Object.assign({id:edit?rec.id:"h"+Date.now()+Math.random().toString(36).slice(2,6),category:cat.title,cartridge:cart,name,bullet_maker:mk,bullet:bn,
        bullet_gr:gr,diameter_in:dm,bc_g1:bc,powder:pw,powder_gr:pg,muzzle_fps:fps,barrel_in:bl||0,purpose:q("#hpu").value,cost:+cost.toFixed(4),notes:q("#hno").value.trim()},
        tot>0?{bullet_cost:0,powder_cost_lb:0,primer_cost:0,brass_cost:0,brass_reuse:5}:parts);
    }catch(e){alert(e.message);return;}
    const rows=readHand();const i=rows.findIndex(x=>x.id===r.id);
    if(i>=0)rows[i]=r;else rows.push(r);
    if(!writeHand(rows)){alert("Couldn't save: browser storage isn't available.");return;}
    close();done(r);
  };
  q("#hc").focus();
}

// ---------- Compare Loads tab ----------
function openLoads(cat,pane){
  syncHand(cat);
  const all=state.detail[cat.title];
  let groups,carts;const regroup=()=>{groups=groupBy(all,false);if(cat.grain_style)groups=withHandloadOnly(groups,state.loads[cat.title]);carts=[...groups.keys()];};regroup();
  const sh=shared[cat.title]||{};
  const L={open:null,sort:"score",weightsOpen:false,prices:readPrices(),purpose:sh.purpose||"All",src:"All"};
  const keyOf=it=>it.hid||it.label;
  const PORDER=["Hunting","Varmint","Target","Match","Defense","Subsonic","Game","Waterfowl","Turkey","Buckshot","Slug"];
  const purposeOf=it=>it.purpose||it.group||"";
  pane.innerHTML=`<div class="card">
    <div class="field"><label class="l">${esc(cat.cartridge_label)}</label><select id="lc"></select></div>
    <div class="nums" style="grid-template-columns:1fr 1fr">
      <div><label class="l">DISTANCE (YD)</label><input id="ld" inputmode="decimal"></div>
      <div><label class="l">${esc(cat.gun_label)}</label><input id="lg" inputmode="decimal"></div>
    </div>
    <div class="chips" id="lp" role="group" aria-label="Purpose"></div>
    <div class="chips hidden" id="lsrc" role="group" aria-label="Source"></div>
    <div class="sortrow"><input id="lf" type="search" placeholder="Filter by brand or load, e.g. hornady" autocomplete="off">
      <select id="ls"><option value="score">Sort: best value</option><option value="cost">Sort: lowest price</option><option value="velocity">Sort: fastest</option><option value="energy">Sort: most energy</option>${cat.terminal?'<option value="taylor">Sort: highest Taylor KO</option><option value="hits">Sort: highest HITS</option>':""}<option value="recoil">Sort: least recoil</option></select></div>
    <div class="links"><button class="link m" id="lwt">▸&nbsp; Scoring weights</button>${cat.grain_style?'<button class="link" id="hadd">+&nbsp; Add handload</button>':""}</div>
    <div class="weights hidden" id="lwb"><div class="wrow">${MKEYS.map(k=>`<div class="${keysOf(cat).includes(k)?"":"hidden"}"><label>${METRICS[k][0]}</label><input id="lw_${k}" inputmode="numeric"></div>`).join("")}</div>
      <div class="help">Higher = matters more. 0 ignores that factor.</div></div>
  </div>
  <div class="cnt" id="lcnt"></div><div class="lgrid" id="lres"></div>
  <div class="note" id="lnote"></div>`;
  const $$=s=>$(s,pane);
  const fillCarts=()=>{$$("#lc").innerHTML=`<option value="" disabled hidden>Select…</option>`+carts.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("");};
  fillCarts();
  const biggest=carts.reduce((a,c)=>groups.get(c).length>groups.get(a).length?c:a,carts[0]);
  $$("#lc").value=(sh.cart&&groups.has(sh.cart))?sh.cart:biggest;
  $$("#ld").value=sh.dist!=null?sh.dist:g(cat.default_distance);
  $$("#lg").value=sh.gun!=null?sh.gun:g(cat.default_gun_lb);
  MKEYS.forEach((k,i)=>$$("#lw_"+k).value=sh.w?sh.w[k]:cat.weights[i]);
  const readNum=(id,lo,hi)=>{const v=parseFloat($$(id).value);return isNaN(v)?null:Math.min(hi,Math.max(lo,v));};
  const priceOf=it=>{const v=L.prices[priceKey(cat,it)];return typeof v==="number"?v:it.default_cost;};
  app._leave=()=>{shared[cat.title]={purpose:L.purpose,cart:$$("#lc").value,dist:$$("#ld").value,gun:$$("#lg").value,w:Object.fromEntries(MKEYS.map(k=>[k,$$("#lw_"+k).value]))};};
  function buildChips(){
    const items=groups.get($$("#lc").value)||[], cnt={};
    items.forEach(x=>{const p=purposeOf(x);if(p)cnt[p]=(cnt[p]||0)+1;});
    const names=Object.keys(cnt).sort((a,b)=>(PORDER.indexOf(a)<0?99:PORDER.indexOf(a))-(PORDER.indexOf(b)<0?99:PORDER.indexOf(b)));
    if(L.purpose!=="All"&&!cnt[L.purpose])L.purpose="All";
    const box=$$("#lp");
    const nh=items.filter(x=>x.handload).length,sb=$$("#lsrc");
    if(!nh)L.src="All";
    if(nh){
      sb.classList.remove("hidden");
      sb.innerHTML=[["All",items.length],["Factory",items.length-nh],["Handloads",nh]].map(([n,c])=>`<button data-s="${n}" class="${L.src===n?"on":""}" aria-pressed="${L.src===n}">${n}<small>${c}</small></button>`).join("");
      sb.querySelectorAll("button").forEach(b=>b.onclick=()=>{L.src=b.dataset.s;L.open=null;buildChips();render();});
    }else{sb.innerHTML="";sb.classList.add("hidden");}
    if(names.length<2){box.innerHTML="";box.classList.add("hidden");return;}
    box.classList.remove("hidden");
    box.innerHTML=[["All",items.length]].concat(names.map(n=>[n,cnt[n]])).map(([n,c])=>`<button data-p="${esc(n)}" class="${L.purpose===n?"on":""}" aria-pressed="${L.purpose===n}">${esc(n)}<small>${c}</small></button>`).join("");
    box.querySelectorAll("button").forEach(b=>b.onclick=()=>{L.purpose=b.dataset.p;L.open=null;buildChips();render();});
  }
  // chip counts follow the brand/load filter (and the purpose chips the Show choice too)
  const matchesFilter=x=>{const q=$$("#lf").value.trim().toLowerCase().split(/\s+/).filter(Boolean),t=(x.load+" "+(x.group||"")+" "+x.bullet_gr).toLowerCase();return q.every(w=>t.includes(w));};
  function countChips(){
    const items=(groups.get($$("#lc").value)||[]).filter(matchesFilter);
    $$("#lsrc").querySelectorAll("button").forEach(b=>{const s=b.dataset.s;b.querySelector("small").textContent=items.filter(x=>s==="All"||!!x.handload===(s==="Handloads")).length;});
    const shown=items.filter(x=>L.src==="All"||!!x.handload===(L.src==="Handloads"));
    $$("#lp").querySelectorAll("button").forEach(b=>{const p=b.dataset.p;b.querySelector("small").textContent=p==="All"?shown.length:shown.filter(x=>purposeOf(x)===p).length;});
  }
  function compute(){
    const dist=readNum("#ld",0,cat.max_distance), gun=readNum("#lg",.5,30);
    const weights={};let bad=false;
    for(const k of MKEYS){const v=parseFloat($$("#lw_"+k).value);if(isNaN(v)||v<0)bad=true;weights[k]=bad?0:Math.min(10,v);}
    if(dist==null||gun==null||bad)return null;
    let items=groups.get($$("#lc").value)||[];
    if(L.purpose!=="All")items=items.filter(x=>purposeOf(x)===L.purpose);
    const rows=items.map(it=>({it,st:computeStats(it,dist,gun,priceOf(it))}));
    // score each type (shotgun load type) on its own so slugs aren't judged against target loads
    const byType=new Map();rows.forEach(r=>{const k=r.it.group||"";if(!byType.has(k))byType.set(k,[]);byType.get(k).push(r);});
    for(const [k,rs] of byType){
      const res=relativeScores(rs.map(r=>r.st),weights);
      rs.forEach((r,i)=>{r.sc=res[i][0];r.overall=res[i][1];r.grade=gradeRel(r.overall);r.peers=rs.length;});
      [...rs].sort((a,b)=>b.overall-a.overall).forEach((r,i)=>r.rank=i+1);
    }
    return {rows,dist,gun,multi:byType.size>1};
  }
  function render(){
    const out=compute(),box=$$("#lres");
    if(!out){box.innerHTML=`<div class="muted">Enter a distance, gun weight and weights (numbers) to see results.</div>`;$$("#lcnt").textContent="";return;}
    if(!(groups.get($$("#lc").value)||[]).length){box.innerHTML=`<div class="muted">No factory loads listed for ${esc($$("#lc").value)}. Use “+ Add handload” to grade your own.</div>`;$$("#lcnt").textContent="";return;}
    countChips();
    let rows=out.rows.filter(r=>(L.src==="All"||(L.src==="Handloads")===!!r.it.handload)).filter(r=>matchesFilter(r.it));
    const key=$$("#ls").value;
    const cmp={score:(a,b)=>(a.it.group||"").localeCompare(b.it.group||"")||b.overall-a.overall,
      cost:(a,b)=>a.st.cost-b.st.cost,velocity:(a,b)=>b.st.velocity-a.st.velocity,energy:(a,b)=>b.st.energy-a.st.energy,taylor:(a,b)=>b.st.taylor-a.st.taylor,hits:(a,b)=>b.st.hits-a.st.hits,recoil:(a,b)=>a.st.recoil-b.st.recoil}[key];
    rows.sort(cmp);
    $$("#lcnt").textContent=`${rows.length} of ${out.rows.length} loads at ${g(out.dist)} yards`+(L.purpose!=="All"?` · ${L.purpose} only`:"")+(out.multi?" · ranked within each load type":"");
    box.innerHTML=rows.map((r,n)=>{
      const it=r.it,open=L.open===keyOf(it), edited=!it.handload&&typeof L.prices[priceKey(cat,it)]==="number";
      const badge=(gr)=>`<span class="badge" style="background:${GRADE_COLORS[gr][0]};color:${GRADE_COLORS[gr][1]}">${gr}</span>`;
      const fb=k=>badge(gradeRel(r.sc[k]));
      const payload=cat.show_oz?`${it.bullet_gr.toFixed(0)} gr (${(it.bullet_gr/GRAINS_PER_OZ).toFixed(2)} oz)`:`${g(it.bullet_gr)} gr`;
      return `<div class="lc ${open?"open":""} ${it.handload?"hl":""}" data-i="${esc(keyOf(it))}"><div class="top"><span class="rk">#${r.rank}</span>
        <div class="nm">${esc(it.load)}${cat.grain_style?` · <span class="wt">${g(it.bullet_gr)} gr</span>`:""}${it.handload?'<span class="chip">Handload</span>':""}${purposeOf(it)&&L.purpose==="All"&&!it.handload?`<span class="chip">${esc(purposeOf(it))}</span>`:""}</div>
        <div class="sc">${badge(r.grade)}<span class="n">${r.overall.toFixed(0)}</span></div></div>
        ${open?`<div class="det">
          ${it.handload?"":`<div class="row"><span class="muted">${cat.grain_style?"Bullet weight":"Payload"}</span><span class="v">${payload}</span><span style="width:32px"></span></div>`}
          ${cat.grain_style?`<div class="row"><span class="muted">Test barrel</span><span class="v">${it.barrel_in?g(it.barrel_in)+" in":"not listed"}</span><span style="width:32px"></span></div>`:""}
          ${purposeOf(it)?`<div class="row"><span class="muted">Purpose</span><span class="v">${esc(purposeOf(it))}</span><span style="width:32px"></span></div>`:""}
          <div class="row"><span class="muted">Velocity</span><span class="v">${r.st.velocity.toFixed(0)} fps</span>${fb("velocity")}</div>
          <div class="row"><span class="muted">Energy</span><span class="v">${r.st.energy.toFixed(0)} ft-lbs</span>${fb("energy")}</div>
          <div class="row"><span class="muted">Recoil</span><span class="v">${r.st.recoil.toFixed(1)} ft-lbs</span>${fb("recoil")}</div>
          ${it.handload?(()=>{const r0=it.rec,cp=costParts(r0),hasP=cp.b||cp.p||cp.pr||cp.br;return `<div class="row"><span class="muted">Bullet</span><span class="v">${esc([r0.bullet_maker,r0.bullet].filter(Boolean).join(" ")||"custom")}, ${g(it.bullet_gr)} gr</span><span style="width:32px"></span></div>
          <div class="row"><span class="muted">Powder</span><span class="v">${esc(r0.powder||"—")} ${g(it.powder_gr)} gr</span><span style="width:32px"></span></div>
          ${hasP?`<div class="row"><span class="muted">Cost breakdown</span><span class="v" style="font-size:.85rem;font-weight:600">bullet $${cp.b.toFixed(2)} · powder $${cp.p.toFixed(2)} · primer $${cp.pr.toFixed(2)} · brass $${cp.br.toFixed(2)}</span><span style="width:32px"></span></div>`:""}
          ${r0.notes?`<div class="row"><span class="muted">Notes</span><span class="v" style="font-weight:500">${esc(r0.notes)}</span><span style="width:32px"></span></div>`:""}`;})():""}
          <div class="row"><span class="muted">Price</span><span class="v">$${r.st.cost.toFixed(2)}${edited?" ✎":""}</span>${fb("cost")}</div>
          ${cat.terminal?`<div class="row"><span class="muted">Taylor KO</span><span class="v">${r.st.taylor.toFixed(1)}</span>${fb("taylor")}</div>
          <div class="row"><span class="muted">HITS</span><span class="v">${r.st.hits.toFixed(0)} <small class="muted">(${hitsClass(r.st.hits)})</small></span>${fb("hits")}</div>`:""}
          <div class="muted" style="font-size:.8rem;margin-top:4px">Ranks #${r.rank} of ${r.peers}${out.multi?" "+esc(it.group)+" loads":" "+esc(it.cartridge)+" loads"}. Grades compare loads of this cartridge only.</div>
          ${it.handload?`<div class="hbtns"><button class="btn p hedit">Edit</button><button class="btn hdup">Duplicate</button><button class="btn d hdel">Delete</button></div>
          <div class="note">${esc(SOURCE_NOTES.handload)}</div></div>`:`<div class="prow"><span class="muted" style="font-size:.85rem">Your price $</span><input class="pin" inputmode="decimal" value="${r.st.cost.toFixed(2)}" aria-label="Your price per round"><button class="btn p setp">Set</button>${edited?`<button class="btn clrp">Use estimate</button>`:""}</div>
          <div class="note">${esc(SOURCE_NOTES[it.source]||DEFAULT_SOURCE_NOTE)} Catalog price estimate: $${it.default_cost.toFixed(2)}.</div></div>`}`:""}
      </div>`;}).join("")||`<div class="muted">No loads match that filter.</div>`;
    box.querySelectorAll(".lc").forEach(c=>{
      const lab=c.dataset.i;
      c.onclick=e=>{if(e.target.closest(".prow,.hbtns"))return;L.open=L.open===lab?null:lab;render();};
      const it=all.find(x=>keyOf(x)===lab&&x.cartridge===$$("#lc").value);
      if(it&&it.handload){
        if(!c.querySelector(".hedit"))return;
        c.querySelector(".hedit").onclick=()=>openHand(it.rec);
        c.querySelector(".hdup").onclick=()=>{const rows=readHand(),n=Object.assign({},it.rec,{id:"h"+Date.now()+Math.random().toString(36).slice(2,6),name:it.rec.name+" (copy)"});rows.push(n);writeHand(rows);afterHand(n);};
        c.querySelector(".hdel").onclick=()=>{if(!confirm(`Delete "${it.rec.name}"?`))return;writeHand(readHand().filter(x=>x.id!==it.rec.id));L.open=null;afterHand(null);};
        return;
      }
      const sp=c.querySelector(".setp"),cl=c.querySelector(".clrp");
      if(sp)sp.onclick=()=>{const v=parseFloat(c.querySelector(".pin").value);if(!(v>=0)){alert("Enter a price, e.g. 0.45");return;}L.prices[priceKey(cat,it)]=v;writePrices(L.prices);render();};
      if(cl)cl.onclick=()=>{delete L.prices[priceKey(cat,it)];writePrices(L.prices);render();};
    });
    $$("#lnote").textContent=`Grades compare loads of this cartridge${L.purpose!=="All"?" and purpose ("+L.purpose+")":""}; the average scores about ${REL_CENTER}. Prices are estimates.`;
  }
  function openHand(rec){
    const cl=[...new Set([...carts,...state.loads[cat.title].map(x=>x.cartridge)])];
    handDialog(cat,rec||{cartridge:$$("#lc").value},cl,afterHand);
  }
  function afterHand(r){
    const cur0=$$("#lc").value;syncHand(cat);regroup();fillCarts();$$("#lc").value=groups.has(cur0)?cur0:(groups.has(biggest)?biggest:carts[0]);
    if(r){const cur=r.cartridge;$$("#lc").value=cur;L.purpose="All";L.src="All";const it=all.find(x=>x.hid===r.id);L.open=it?keyOf(it):null;}
    
    buildChips();render();
  }
  if(cat.grain_style)$$("#hadd").onclick=()=>openHand(null);
  $$("#lc").onchange=()=>{L.open=null;buildChips();render();};
  ["#ld","#lg","#lf"].concat(MKEYS.map(k=>"#lw_"+k)).forEach(id=>$$(id).addEventListener("input",render));
  $$("#ls").onchange=render;
  $$("#lwt").onclick=()=>{L.weightsOpen=!L.weightsOpen;$$("#lwb").classList.toggle("hidden",!L.weightsOpen);$$("#lwt").innerHTML=(L.weightsOpen?"▾":"▸")+"&nbsp; Scoring weights";};
  buildChips();render();
}

function modal(inner){
  const m=el(`<div class="modal"><div class="card">${inner}</div></div>`);
  document.body.appendChild(m);document.body.style.overflow="hidden";
  const close=()=>{m.remove();document.body.style.overflow="";};
  m.addEventListener("mousedown",e=>{if(e.target===m)close();});
  return [m,close];
}

function addDialog(V,cat,regroup,done){
  const [m,close]=modal(`
    <h3 style="margin:0 0 12px">Add your own caliber — ${esc(cat.title)}</h3>
    <label class="l">CARTRIDGE NAME</label><input id="n" list="dl" autocomplete="off"><datalist id="dl">${V.cartridges.map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
    <div class="help">Pick an existing one to add another load to it, or type a new name.</div>
    <div class="three"><div><label class="l">BULLET WEIGHT (GR)</label><input id="gr" inputmode="decimal"></div>
      <div><label class="l">MUZZLE VEL. (FPS)</label><input id="fps" inputmode="decimal"></div>
      <div><label class="l">PRICE / ROUND ($)</label><input id="pc" inputmode="decimal"></div></div>
    <button class="link m" id="mt" style="margin-top:12px">▸&nbsp; More details (optional)</button>
    <div id="more" class="hidden"><div class="three"><div><label class="l">LOAD NAME</label><input id="ln"></div>
      <div><label class="l">BC (G1)</label><input id="bc" inputmode="decimal"></div>
      <div><label class="l">POWDER (GR)</label><input id="pw" inputmode="decimal"></div></div>
      ${cat.terminal?`<div class="three" style="grid-template-columns:1fr 2fr"><div><label class="l">DIAMETER (IN)</label><input id="dm" inputmode="decimal"></div><div class="help" style="align-self:end">Used for Taylor KO and HITS. Blank = guessed from the weight.</div></div>`:""}
      <div class="help">Leave blank to use typical values (BC ${g(cat.default_bc)}; powder estimated from the speed and weight). Filling these in makes the recoil and long-range numbers more accurate.</div></div>
    <div class="btns"><button class="btn p" id="save">Save caliber</button><button class="btn" id="cancel">Cancel</button></div>`);
  const q=s=>$(s,m);
  q("#mt").onclick=()=>{const o=q("#more").classList.toggle("hidden");q("#mt").innerHTML=(o?"▸":"▾")+"&nbsp; More details (optional)";};
  q("#cancel").onclick=close;
  const num=(id,label,lo,hi,blank)=>{
    const t=q("#"+id).value.trim().replace("$","");
    if(!t){if(blank)return null;throw new Error(`${label} is required.`);}
    const v=Number(t);if(!isFinite(v))throw new Error(`${label} must be a number.`);
    if(v<lo||(hi!=null&&v>hi))throw new Error(`${label} must be ${hi!=null?`between ${g(lo)} and ${g(hi)}`:`${g(lo)} or more`}.`);
    return v;
  };
  q("#save").onclick=()=>{
    let row;
    try{
      const name=q("#n").value.trim();if(!name)throw new Error("Enter a cartridge name.");
      const gr=num("gr","Bullet weight",1,2000),fps=num("fps","Muzzle velocity",100,5500),cost=num("pc","Price per round",0);
      const dm=cat.terminal?num("dm","Bullet diameter",0.1,1,true):null;
      const bc=num("bc","Ballistic coefficient",0.01,1.5,true),pw=num("pw","Powder charge",0.1,300,true);
      row={category:cat.title,cartridge:name,load:q("#ln").value.trim()||"Custom",bullet_gr:gr,muzzle_fps:fps,
           bc_g1:bc!=null?bc:cat.default_bc,powder_gr:+(pw!=null?pw:estimatePowder(gr,fps)).toFixed(1),default_cost:+cost.toFixed(2)};
      if(dm)row.diameter_in=dm;
    }catch(e){alert(e.message);return;}
    const it={cartridge:row.cartridge,load:row.load,bullet_gr:row.bullet_gr,muzzle_fps:row.muzzle_fps,bc_g1:row.bc_g1,powder_gr:row.powder_gr,default_cost:row.default_cost,source:"custom",group:"",is_default:false,diameter_in:row.diameter_in||0};
    it.label=makeLabel(it,cat);
    const taken=new Set(V.loads.filter(x=>x.cartridge===it.cartridge).map(x=>x.label));
    const base=it.label;let n=1;
    while(taken.has(it.label)){n++;it.label=`${base} (custom${n===2?"":" "+(n-1)})`;}
    const rows=readCustom();rows.push(row);
    if(!writeCustom(rows)){alert("Couldn't save: browser storage isn't available.");return;}
    V.loads.push(it);regroup();close();done(it);
  };
  q("#n").focus();
}

function compareAll(V,readInputs,show){
  let inp;try{inp=readInputs(false);}catch(e){alert(e.message);return;}
  const cat=V.cat,refs=referenceLevels(V.loads,inp.dist,inp.gun);
  const scored=V.loads.map(it=>{const s=computeStats(it,inp.dist,inp.gun),[,o]=scoreStats(s,refs,inp.weights);return [it,s,o];});
  const rankOf=new Map([...scored].sort((a,b)=>b[2]-a[2]).map((t,n)=>[t[0],n+1]));
  const rows=scored.map(([it,s,o])=>[rankOf.get(it),it.cartridge,it.label,Math.round(s.weight),Math.round(s.velocity),Math.round(s.energy),+s.recoil.toFixed(1),+s.taylor.toFixed(1),Math.round(s.hits),s.cost,+o.toFixed(1),gradeFor(o),it]);
  const allCols=["Rank",cat.cartridge_label.charAt(0)+cat.cartridge_label.slice(1).toLowerCase(),"Load",cat.payload_col,"Velocity (fps)","Energy (ft-lbs)","Recoil (ft-lbs)","Taylor KO","HITS","Cost ($)","Score (%)","Grade"];
  const cols=allCols.filter(c=>cat.terminal||(c!=="Taylor KO"&&c!=="HITS"));
  const keepCols=new Set(["Rank","Load","Score (%)","Grade"]);
  const bestFirst=new Set(["Rank",allCols[3],"Velocity (fps)","Energy (ft-lbs)","Taylor KO","HITS","Score (%)"]);
    const [m,close]=modal(`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3 style="margin:0">${esc(cat.title)}: all loads at ${g(inp.dist)} yards</h3><button class="btn" id="x">Close</button></div>
    <div class="filters"><input id="flt" type="search" placeholder="Filter, e.g. federal 168" autocomplete="off"><select id="fc"><option value="">All ${esc(cat.cartridge_label.toLowerCase())}s</option>${V.cartridges.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("")}</select></div>
    <div class="cnt" id="cnt"></div>
    <div class="tblwrap"><table><thead><tr>${cols.map((c,i)=>`<th data-i="${i}"${c==="Load"?' class="ld"':keepCols.has(c)?"":' class="mn"'}>${esc(c)}</th>`).join("")}</tr></thead><tbody></tbody></table></div>
    <div class="note">Tap a heading to sort and a row to open it in the calculator. Scores use your current weights and each load's default price.</div>`);
  $("#x",m).onclick=close;
  const st={col:"Score (%)",desc:true},tb=$("tbody",m);let shown=[];
  const render=()=>{
    const terms=$("#flt",m).value.toLowerCase().split(/\s+/).filter(Boolean),want=$("#fc",m).value;
    shown=rows.filter(r=>(!want||r[1]===want)&&terms.every(t=>(r[1]+" "+r[2]).toLowerCase().includes(t)));
    const i=allCols.indexOf(st.col);
    shown.sort((a,b)=>{const x=a[i],y=b[i],c=x<y?-1:x>y?1:0;return c?(st.col==="Rank"?c:(st.desc?-c:c)):a[0]-b[0];});
    tb.innerHTML=shown.map((r,n)=>`<tr data-n="${n}"><td>${r[0]}</td><td class="mn">${esc(r[1])}</td><td class="ld"><span class="pc">${esc(r[1])}</span>${esc(r[2])}</td><td class="mn">${r[3]}</td><td class="mn">${r[4]}</td><td class="mn">${r[5]}</td><td class="mn">${r[6]}</td>${cat.terminal?`<td class="mn">${r[7]}</td><td class="mn">${r[8]}</td>`:""}<td class="mn">${r[9].toFixed(2)}</td><td>${r[10]}</td><td><span class="badge" style="background:${GRADE_COLORS[r[11]][0]};color:${GRADE_COLORS[r[11]][1]}">${r[11]}</span></td></tr>`).join("");
    $("#cnt",m).textContent=`Showing ${shown.length} of ${rows.length} loads`;
  };
  const sortBy=col=>{st.desc=st.col===col?!st.desc:bestFirst.has(col);st.col=col;render();};
  m.querySelectorAll("th").forEach(th=>th.onclick=()=>sortBy(cols[+th.dataset.i]));
  tb.onclick=e=>{const tr=e.target.closest("tr");if(!tr)return;const r=shown[+tr.dataset.n];close();show(r[12]);};
  $("#flt",m).addEventListener("input",render);$("#fc",m).addEventListener("change",render);
  render();
}

$("#ver").textContent=VERSION_TEXT;$("#size1").innerHTML=sizeCtl();$("#size2").innerHTML=sizeCtl();wireSize(document.body);
navigate("home");
</script>
