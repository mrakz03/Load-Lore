<body>
<div class="shell">
  <aside class="side" data-nosnippet>
    <div class="brand" data-nosnippet><div><small>In Like Flint</small><b>Load Lore</b><div class="ver" id="ver"></div></div></div>
    <nav class="nav" id="nav" aria-label="Main"></nav>
  </aside>
  <main class="main">
    <div class="wrap" id="app"></div>
  </main>
</div>
<script>
"use strict";
const DATA = __DATA__;
const APP_TITLE = "In Like Flint - Load Lore" + (DATA.beta ? " (beta)" : "");  // DATA.beta: the beta site (build_web.py LOADLORE_BETA)
// ---------- color themes (same table as the desktop app) ----------
const THEMES = DATA.themes || {}, THEME_KEY = "cartridge_calc_theme";
const THEME_VARS = {bg:"--bg",surface:"--surface",surface_2:"--surface2",border:"--border",text:"--text",muted:"--muted",
  accent:"--accent",accent_hover:"--accent-h",on_accent:"--on-accent",side:"--side",danger:"--danger",hand:"--hand"};
let THEME = DATA.default_theme || "Classic";
try{const t=localStorage.getItem(THEME_KEY);if(t&&THEMES[t])THEME=t;}catch(e){}
function applyTheme(name){
  const t=THEMES[name];if(!t)return;THEME=name;
  const st=document.documentElement.style;
  for(const [k,v] of Object.entries(THEME_VARS))st.setProperty(v,t[k]);
  st.setProperty("--best",t.best||t.accent);   // Head to Head winners: a theme's "best" colour, else the accent
  st.colorScheme=t.scheme;
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t.side;
  try{localStorage.setItem(THEME_KEY,name);}catch(e){}
}
applyTheme(THEME);
const VERSION_TEXT = /^\d/.test(DATA.version || "") ? "v" + DATA.version : (DATA.version || "dev");  // "1.10" -> v1.10; "dev", "beta 3f2c1ab" as they are
const GRAINS_PER_OZ = 437.5;
const METRICS = {velocity:["Velocity",true],energy:["Energy",true],recoil:["Recoil",false],cost:["Cost",false],taylor:["Taylor KO",true],hits:["HITS",true]};
const TERMINAL=["taylor","hits"];
const keysOf=cat=>cat.terminal?MKEYS:MKEYS.filter(k=>!TERMINAL.includes(k));
const DIAMETERS=DATA.diameters;
const MKEYS = Object.keys(METRICS);
const TYPICAL_SCORE = 70.0;
const HIGH_K = -Math.log(1 - TYPICAL_SCORE/100), LOW_K = -Math.log(TYPICAL_SCORE/100);
const GRADE_COLORS = {S:["#a98bff","#1b0a40"],A:["#2fbf71","#06210f"],B:["#4c8dff","#06152e"],C:["#e5b93c","#2b2005"],D:["#e98a3c","#2e1704"],F:["#e5534b","#2e0a08"]};
// a grade chip ("A" on its colour) and a price, for the load lists
const badge=gr=>`<span class="badge" style="background:${GRADE_COLORS[gr][0]};color:${GRADE_COLORS[gr][1]}">${gr}</span>`;
const money=v=>v==null?"—":"$"+v.toFixed(2);   // null: no cost given
const fbadge=v=>v==null?"":badge(gradeRel(v));   // a factor's grade badge, none when the load lacks it
const SOURCE_NOTES = {
  catalog:"Weight and velocity come from the manufacturer's 2026 catalog. The ballistic coefficient is the catalog's own figure or is worked out from its published downrange velocities; powder charge (recoil) and price are estimated.",
  published:"Weight, velocity and ballistic coefficient are manufacturer-published; powder charge (used for recoil) is estimated.",
  partial:"Weight and velocity are manufacturer-published; ballistic coefficient and powder charge are estimated.",
  custom:"Your own entry. Anything you left blank was estimated.",
  typical:"Typical factory-load figures from published specs; approximate, so check the box.",
  handload:DATA.hand_note,
  estimate:"ESTIMATE: no carbine velocity is published for this load. Its velocity is worked out from the maker's handgun figure for a 16 in carbine barrel; ballistic coefficient, powder charge and price are as in Pistol / Revolver.",
  tested:"Carbine velocity measured by a reviewer's chronograph, not printed by the maker; ballistic coefficient and powder charge are estimated."};
const DEFAULT_SOURCE_NOTE = "Load data is approximate. Check it against the box or the manufacturer.";
const REL_CENTER=70, REL_SPREAD=10, REL_BANDS=[[85,"S"],[77,"A"],[66,"B"],[55,"C"],[45,"D"]];
// saved data may use cartridge names from before a rename (e.g. "7.62x54R" -> "7.62x54mmR")
const RENAMED = DATA.renamed || {};
// .223 Rem / 5.56 NATO and .308 Win / 7.62x51mm NATO were one list each until issue #28 (SPLIT_CARTRIDGES):
// old saved handloads go to the commercial cartridge, an old saved price is kept for both
const SPLIT = DATA.split || {};
const canon = n => {n=RENAMED[n]||n;return SPLIT[n]?SPLIT[n][0]:n;};
// cartridges that left a category (MOVED_CATEGORIES: .357 / .44 Magnum rifle -> Pistol Caliber Carbine)
const MOVED = DATA.moved || {};
const movedCat = (cat, cart) => MOVED[cat + "|" + cart] || cat;
const canonRows = a => (Array.isArray(a) ? a : []).map(r => {
  if (!(r && typeof r === "object" && r.cartridge)) return r;
  const c = canon(r.cartridge);
  return r.category ? {...r, cartridge: c, category: movedCat(r.category, c)} : {...r, cartridge: c};
});
const PRICE_KEY = "cartridge_calc_prices_v1";
const GRADES_KEY = "cartridge_calc_grades";

const CATEGORIES = DATA.categories;   // title, blurb, distances, labels, flags, weights, loads
const G1 = [[0,.2629],[.05,.2558],[.1,.2487],[.15,.2413],[.2,.2344],[.25,.2278],[.3,.2214],[.35,.2155],[.4,.2104],[.45,.2061],[.5,.2032],[.55,.202],[.6,.2034],[.7,.2165],[.725,.223],[.75,.2313],[.775,.2417],[.8,.2546],[.825,.2706],[.85,.2901],[.875,.3136],[.9,.3415],[.925,.3734],[.95,.4084],[.975,.4448],[1,.4805],[1.025,.5136],[1.05,.5427],[1.075,.5677],[1.1,.5883],[1.125,.6053],[1.15,.6191],[1.2,.6393],[1.25,.6518],[1.3,.6589],[1.35,.6621],[1.4,.6625],[1.45,.6607],[1.5,.6573],[1.55,.6528],[1.6,.6474],[1.65,.6413],[1.7,.6347],[1.75,.628],[1.8,.621],[1.85,.6141],[1.9,.6072],[1.95,.6003],[2,.5934],[2.05,.5867],[2.1,.5804],[2.15,.5743],[2.2,.5685],[2.25,.563],[2.3,.5577],[2.35,.5527],[2.4,.5481],[2.45,.5438],[2.5,.5397],[2.6,.5325],[2.7,.5264],[2.8,.5211],[2.9,.5168],[3,.5133],[3.1,.5105],[3.2,.5084],[3.3,.5067],[3.4,.5054],[3.5,.504],[3.6,.503],[3.7,.5022],[3.8,.5016],[3.9,.501],[4,.5006],[4.2,.4998],[4.4,.4995],[4.6,.4992],[4.8,.499],[5,.4988]];
const FT_PER_M=3.280839895, YD_PER_M=1.093613298, SOS=340.3, RHO=1.225, LBIN2=703.0696;
const KDRAG = RHO*Math.PI/(8*LBIN2);

// ---------- helpers ----------
const $ = (s,r=document)=>r.querySelector(s);
const esc = s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function g(n){return String(+(+n).toPrecision(6));}          // like Python's :g
function el(html){const t=document.createElement("template");t.innerHTML=html.trim();return t.content.firstChild;}

// ---------- ballistics ----------
function g1cd(m){
  if(m<=G1[0][0])return G1[0][1];
  const last=G1[G1.length-1]; if(m>=last[0])return last[1];
  let lo=0,hi=G1.length;                       // bisect_right
  while(lo<hi){const mid=(lo+hi)>>1; if(m<G1[mid][0])hi=mid; else lo=mid+1;}
  const [m0,c0]=G1[lo-1],[m1,c1]=G1[lo];
  return c0+(c1-c0)*(m-m0)/(m1-m0);
}
function velocityAt(fps,bc,distYd){
  if(distYd<=0)return +fps;
  let v=fps/FT_PER_M; const total=distYd/YD_PER_M, step=0.5; let x=0;
  const dvdx=s=>-KDRAG*g1cd(s/SOS)*s/bc;
  while(x<total && v>1){
    const h=Math.min(step,total-x), k1=dvdx(v), k2=dvdx(v+0.5*h*k1);
    v+=h*k2; x+=h;
  }
  return Math.max(v,0)*FT_PER_M;
}
const energy=(gr,v)=>gr*v*v/450240;
const GRAVITY=9.80665,IN_PER_M=39.37007874,WIND_MPH=10,MS_PER_MPH=0.44704;
// point-mass flight: G1 drag along the path plus gravity, RK2 steps of 0.5 m downrange (_fly)
function fly(fps,bc,y0,ang,marks){
  let v=fps/FT_PER_M,vx=v*Math.cos(ang),vy=v*Math.sin(ang),x=0,y=y0,t=0;const step=0.5,out=new Map([[0,[0,y0]]]);
  const d=(vx,vy)=>{const sp=Math.hypot(vx,vy),k=KDRAG*g1cd(sp/SOS)*sp/bc;return [-k,-(k*vy+GRAVITY)/vx,vy/vx,1/vx];};
  for(const m of [...new Set(marks)].sort((a,b)=>a-b)){
    while(x<m-1e-12&&vx>1){const h=Math.min(step,m-x),a=d(vx,vy),b=d(vx+0.5*h*a[0],vy+0.5*h*a[1]);vx+=h*b[0];vy+=h*b[1];y+=h*b[2];t+=h*b[3];x+=h;}
    if(vx<=1)break;
    out.set(m,[t,y]);
  }
  return out;
}
// [time s, path in] at each distance (trajectory in the desktop app), null past the stop point
function trajectory(fps,bc,sightIn,zeroYd,dists){
  const marks=dists.map(d=>d/YD_PER_M),zm=zeroYd/YD_PER_M,y0=-sightIn/IN_PER_M;let ang=0;
  for(let n=0;n<4;n++){const hit=fly(fps,bc,y0,ang,[zm]).get(zm);if(!hit)break;ang-=hit[1]/zm;}
  const f=fly(fps,bc,y0,ang,marks);
  return marks.map(m=>f.has(m)?[f.get(m)[0],f.get(m)[1]*IN_PER_M]:null);
}
// [yards, velocity, energy, path in, 10 mph drift in] out to 5 x step (ballistic_table in the desktop app)
function ballisticTable(it,cat){
  const yards=[];for(let n=0;n<6;n++){const yd=Math.min(n*cat.step_yd,cat.max_distance);if(yards.length&&yd===yards[yards.length-1])break;yards.push(yd);}
  const tr=trajectory(it.muzzle_fps,it.bc_g1,cat.sight_in,cat.zero_yd,yards),v0=it.muzzle_fps/FT_PER_M,rows=[];
  for(let i=0;i<yards.length;i++){
    const yd=yards[i];if(!tr[i])break;const [t,path]=tr[i];
    const v=velocityAt(it.muzzle_fps,it.bc_g1,yd);
    rows.push([yd,v,energy(it.bullet_gr,v),path,WIND_MPH*MS_PER_MPH*(t-(yd/YD_PER_M)/v0)*IN_PER_M]);
  }
  return rows;
}
function ballisticHTML(it,cat,open){
  return `<details class="btab"${open?" open":""}><summary>Ballistic table</summary><div class="tblwrap" style="max-height:none"><table><thead><tr><th>Yd</th><th>Velocity<small>fps</small></th><th>Energy<small>ft-lbs</small></th><th>Path<small>in</small></th><th>Wind<small>in</small></th></tr></thead><tbody>${
    ballisticTable(it,cat).map(([yd,v,e,p,w])=>`<tr><td>${g(yd)}</td><td>${Math.round(v).toLocaleString("en-US")}</td><td>${Math.round(e).toLocaleString("en-US")}</td><td>${Math.abs(p)<0.05?"0.0":(p>0?"+":"−")+Math.abs(p).toFixed(1)}</td><td>${w.toFixed(1)}</td></tr>`).join("")
  }</tbody></table></div><div class="note">Zeroed at ${g(cat.zero_yd)} yd with the sight ${g(cat.sight_in)} in above the bore; wind is a ${WIND_MPH} mph crosswind. Drop and drift are estimates from the G1 BC in sea-level air.</div></details>`;
}
// typical gun weight for cartridges far from their category's default (GUN_LB in the desktop app)
const GUN_LB=DATA.gun_lb||{},GUN_MAX=DATA.gun_max||60;
const typicalGun=(cat,cart)=>{const t=GUN_LB[cat.title]||{};return t[cart]!=null?t[cart]:cat.default_gun_lb;};
// barrel length switch (at_barrel in the desktop app): v x (length / test barrel)^n, the test
// barrel being the category's usual one when none is listed; the copy keeps .base, the listed load
const BARREL=DATA.barrel;
function barrelExp(cat,it){
  const c=it.cartridge,n=BARREL.n;
  if(cat.title==="Rimfire Rifle"||BARREL.rimfire.includes(c))return n.rimfire;
  if(cat.group==="Handgun")return c.includes("Magnum")||BARREL.magnums.includes(c)?n.magnum:BARREL.revolvers.includes(c)?n.revolver:n.auto;
  const ratio=it.bullet_gr>0?it.powder_gr/it.bullet_gr:0;
  return Math.min(.25,Math.max(.10,.10+.25*ratio));
}
// the longest barrel the box takes: the cartridge's longest factory barrel (barrel_max)
// or its makers' longest test barrel when that is longer (cat.test_max)
const barrelMax=(cat,cart)=>{const t=BARREL.max_in[cat.title]||{},f=t[cart]!=null?t[cart]:BARREL.max_cat[cat.title]!=null?BARREL.max_cat[cat.title]:BARREL.max;return Math.max(f,(cat.test_max||{})[cart]||0);};
const barrelHelp=(cat,cart)=>`Barrel length for ${cart}: ${BARREL.min}-${g(barrelMax(cat,cart))} in (${g(barrelMax(cat,cart))} in: its longest factory or test barrel), or blank for the listed figures.`;
// a load printed without its test barrel: its cartridge's usual one (cat.test_barrels), else the
// category's (test_barrel)
const testBarrel=(cat,it)=>it.barrel_in||(cat.test_barrels||{})[it.cartridge]||cat.barrel_in;
function atBarrel(it,cat,len){
  const test=testBarrel(cat,it);
  if(!cat.barrel_in||!len||Math.abs(len-test)<1e-9)return it;
  return Object.assign({},it,{muzzle_fps:it.muzzle_fps*Math.pow(len/test,barrelExp(cat,it)),base:it,at_in:len});
}
// twist rate (stability / at_firearm in the desktop app): Miller's stability factor from an
// estimated bullet length; below 1.5 the BC drops 3% per 0.1 (Litz), below 1.0 it won't stabilise
const TWIST=DATA.twist,FIRE_NOTES=DATA.fire_notes,TW_RE={copper:new RegExp(TWIST.copper,"i"),long:new RegExp(TWIST.long,"i"),blunt:new RegExp(TWIST.blunt,"i")};
const parseTwist=t=>{const m=String(t==null?"":t).match(/\d+(?:\.\d+)?/g);return m?parseFloat(m[m.length-1]):null;};
function bulletLength(it,cat,d){
  const name=it.load||"",dens=TW_RE.copper.test(name)?8.9:10.7;
  const cyl=it.bullet_gr*0.06479891/dens/(Math.PI/4*Math.pow(d*2.54,2))/2.54;
  return cyl*(TW_RE.blunt.test(name)?1.25:TW_RE.long.test(name)?1.45:cat.group==="Handgun"?1.3:1.4);
}
function stability(it,cat,twist){
  const d=bulletDiameter(it);
  if(!twist||!(d>0)||!(it.bullet_gr>0)||!(it.muzzle_fps>0))return 0;
  const t=twist/d,l=bulletLength(it,cat,d)/d;
  return 30*it.bullet_gr/(t*t*d*d*d*l*(1+l*l))*Math.cbrt(it.muzzle_fps/2800);
}
const stabilityBC=sg=>sg<TWIST.stable?1-0.3*(TWIST.stable-Math.max(sg,TWIST.sg_min)):1;
function stabilityText(sg,short){
  const loss=Math.round(100*(1-stabilityBC(sg)));
  if(sg>=TWIST.sg_min&&!loss)return "stable";
  if(sg>=TWIST.sg_min)return `marginal${short?"":":"} BC −${loss}%`;

// In-app history: every page change is a browser history entry (#settings, #loads/Handgun...),
// so the browser's back arrow and the phone's back button step back through the app's pages
// instead of leaving it. how: "pop" (moving through history, add nothing), "replace" (swap
// this entry), else a new entry. depth counts the app's entries before this one.
const NAV_MODES=["home","loads","h2h","bench","hand","settings","favs","ladder"];
const navState=()=>({mode:NAV.mode,cat:NAV.cat?NAV.cat.title:null,sub:NAV.sub||null});   // sub: the open ladder test
const navURL=()=>NAV.mode==="home"?location.pathname+location.search:"#"+NAV.mode+(NAV.cat?"/"+encodeURIComponent(NAV.cat.title):NAV.sub?"/"+encodeURIComponent(NAV.sub):"");
function navRecord(how){
  try{
    const cur=history.state&&history.state.app?history.state:null;
    const st=Object.assign({app:1},navState());
    if(how==="replace"||!cur||(cur.mode===st.mode&&cur.cat===st.cat&&(cur.sub||null)===st.sub)){st.depth=cur&&cur.depth||0;history.replaceState(st,"",navURL());}
    else{st.depth=(cur.depth||0)+1;history.pushState(st,"",navURL());}
  }catch(e){}
}
// a history entry (or a typed / linked #address) -> [mode, category]
function navFrom(st){
  if(!st||!st.mode){const h=(location.hash||"").slice(1).split("/"),rest=h[1]?decodeURIComponent(h.slice(1).join("/")):null;st={mode:h[0],cat:h[0]==="ladder"?null:rest,sub:h[0]==="ladder"?rest:null};}
  const mode=NAV_MODES.includes(st.mode)?st.mode:"home";
  return [mode,mode==="loads"&&st.cat?CATEGORIES.find(c=>c.title===st.cat)||null:null,mode==="ladder"&&st.sub||null];
}
addEventListener("popstate",e=>{
  // back with a dialog or pop-up open closes it and stays on the page
  if(openModalClose){
    openModalClose();
    try{history.pushState(Object.assign({app:1,depth:(e.state&&e.state.depth||0)+1},navState()),"",navURL());}catch(err){}
    return;
  }
  const [mode,cat,sub]=navFrom(e.state);
  navigate(mode,cat,sub,"pop");
});
function navigate(mode,cat,hid,how){   // hid: the handload the Handloads tab opens, or the ladder test to open
  if(app._leave){try{app._leave();}catch(e){}}
  app._leave=null;app.onkeydown=null;
  NAV.mode=mode;NAV.cat=mode==="loads"?(cat||null):null;   // Head to Head has no category
  NAV.sub=mode==="ladder"?(hid||null):null;
  if(how!=="pop")navRecord(how);
  if(NAV.cat&&NAV.cat.group)OPEN_GROUPS.add(NAV.cat.group);   // back on the list, its drop-down is open
  if(NAV.cat){try{localStorage.setItem("cartridge_calc_cat",NAV.cat.title);}catch(e){}}
  drawChrome();

  window.scrollTo(0,0);
  fitMenu();
}

function csvCell(v){v=v==null?"":String(v);return /[",\r\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v;}
function handCSV(rows){return [HAND_FIELDS.join(",")].concat(rows.map(r=>HAND_FIELDS.map(k=>csvCell(r[k]==null||r[k]===0&&/cost|barrel|diameter|col_in/.test(k)&&!r[k]?"":r[k])).join(","))).join("\r\n")+"\r\n";}
function parseCSV(text){

    const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=ch;}
    else if(ch==='"')q=true;
    else if(ch===","){row.push(cell);cell="";}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(cell);cell="";if(row.some(x=>x!==""))out.push(row);row=[];}
    else cell+=ch;
  }
  row.push(cell);if(row.some(x=>x!==""))out.push(row);
  return out;

    r.category=movedCat(r.category,r.cartridge);

// ---------- sync between devices (Nov 2026, Zeke) ----------

// remembers the copy it last agreed on (base): a three-way merge per handload / favorite / price
// keeps whichever side changed (an edit on both: this device's wins; a delete loses to an edit).
// Synced after every change (a moment later), at start and when the app comes back to the front.

const SYNC_PARTS=[["hand","list"],["favs","set"],["prices","map"],["ladders","list"]];

const stable=v=>Array.isArray(v)?"["+v.map(stable).join(",")+"]":v&&typeof v==="object"?"{"+Object.keys(v).sort().filter(k=>v[k]!==undefined).map(k=>JSON.stringify(k)+":"+stable(v[k])).join(",")+"}":JSON.stringify(v===undefined?null:v);

function merge3(b,l,s){

async function syncCall(method,code,body){

// ---------- Ladder tests (Zeke, Nov 2026) ----------
// a handloader's own ladder test: powder charges in small steps, each one's chronograph
// velocities, and which charge is steadiest: the flattest stretch of the velocity curve (a
// "node", where a little more or less powder changes the speed least) and the lowest SD.
// Kept in its own localStorage key so handload sync can carry it later; web / Android only.
const LADDER_KEY="cartridge_calc_ladder_v1";
function readLadders(){try{const a=JSON.parse(localStorage.getItem(LADDER_KEY)||"[]");return Array.isArray(a)?a.filter(t=>t&&t.id&&Array.isArray(t.charges)):[];}catch(e){return [];}}
function writeLadders(a){try{localStorage.setItem(LADDER_KEY,JSON.stringify(a));syncSoon();return true;}catch(e){return false;}}
const LADDER_NOTE="These are your own test results, not load data. The app only does the math on the speeds you type in: it doesn't check pressure or safety, and its picks are not a recommended charge. Work up from a published reloading manual's starting charge, never go over its maximum, and stop at the first sign of pressure.";
// the velocities typed for a charge ("2650 2662, 2648"): numbers from 100 to 6000 fps
const parseShots=s=>String(s||"").split(/[\s,;]+/).map(Number).filter(v=>isFinite(v)&&v>=100&&v<=6000);
function shotStats(shots){
  const v=parseShots(shots),n=v.length;if(!n)return {n:0};
  const mean=v.reduce((a,b)=>a+b,0)/n;
  return {n,mean,min:Math.min(...v),max:Math.max(...v),es:Math.max(...v)-Math.min(...v),sd:n>1?Math.sqrt(v.reduce((a,b)=>a+(b-mean)**2,0)/(n-1)):null,v};
}
// rows: charges with velocities, one per charge (two rows of one charge are pooled), lightest first.
// A charge marked with pressure signs and every charge above it are left out of the picks.
// flat: the three neighbouring charges whose average speed changes least per grain, if that is
// at most half the ladder's overall gain per grain; best: its middle charge (the most forgiving).
function ladderAnalysis(t){
  const by=new Map();
  for(const c of t.charges){
    const gr=+c.gr;if(!(gr>0))continue;
    const k=gr.toFixed(3),p=by.get(k)||{gr,shots:[],pressure:false,group:null};
    p.shots.push(...parseShots(c.shots));p.pressure=p.pressure||!!c.pressure;
    if(+c.group>0)p.group=p.group==null?+c.group:Math.min(p.group,+c.group);
    by.set(k,p);
  }
  const rows=[...by.values()].map(p=>Object.assign(p,shotStats(p.shots.join(" ")))).filter(r=>r.n>0).sort((a,b)=>a.gr-b.gr);
  rows.forEach((r,i)=>{r.gain=i?(r.mean-rows[i-1].mean)/(r.gr-rows[i-1].gr):null;});
  const stop=rows.find(r=>r.pressure)||null,ok=rows.filter(r=>!stop||r.gr<stop.gr);
  const res={rows,stop,ok,overall:null,flat:null,best:null,steadiest:null,tight:null};
  if(ok.length>=2)res.overall=(ok[ok.length-1].mean-ok[0].mean)/(ok[ok.length-1].gr-ok[0].gr);
  if(ok.length>=3){
    let w=null;
    for(let i=0;i+2<ok.length;i++){const a=ok[i],b=ok[i+2],s=(b.mean-a.mean)/(b.gr-a.gr);if(!w||Math.abs(s)<Math.abs(w.slope))w={i,slope:s,from:a.gr,to:b.gr};}
    if(res.overall>0&&Math.abs(w.slope)<=0.5*res.overall){res.flat=w;res.best=ok[w.i+1];}
  }
  const multi=ok.filter(r=>r.n>=3);
  if(multi.length>=2)res.steadiest=multi.reduce((a,b)=>b.sd<a.sd?b:a);
  const grouped=ok.filter(r=>r.group>0);
  if(grouped.length>=2)res.tight=grouped.reduce((a,b)=>b.group<a.group?b:a);
  return res;
}

// a box that picks from a list through a search (issue #24; cartridges too since Oct 2026; a
// picker panel since Oct 2026): every typed word must be in the name. o: text(x) = box text,
// find(x) = searched text (default text),
// head(x) = group heading over the list rows (optional), cur() = the current pick, pick(x), none.
function searchBox(box,items,o){
  const q=box.querySelector(".lq"),all_=()=>typeof items==="function"?items():items;
  const touch=matchMedia("(pointer:coarse)").matches;
  // touch screens: a text layer that wraps the full name (.lsearch.lwrap), so it isn't cut off
  let v=null;
  if(touch){v=box.querySelector(".lqv")||q.insertAdjacentElement("afterend",document.createElement("div"));v.className="lqv";box.classList.add("lwrap");}
  const show=()=>{if(v){v.textContent=q.value||q.placeholder;v.classList.toggle("ph",!q.value);}};
  const back=()=>{const c=o.cur();q.value=c==null?"":o.text(c);show();};
  const p=Object.assign({},o,{pick:x=>{q.value=o.text(x);show();o.pick(x);}});
  // the box only shows the pick, so its text is never selected; phones get the bottom sheet,
  // a mouse / keyboard the same panel as a pop-up under the box (pickSheet)
  q.readOnly=true;box.classList.add("picker");
  if(/type to search/i.test(q.placeholder))q.placeholder=touch?"Choose a "+o.none:o.none[0].toUpperCase()+o.none.slice(1);
  const open=typed=>{if(!q.disabled)pickSheet(all_(),p,touch?null:{el:q,input:q,typed:typed||""});};
  if(touch)q.onfocus=()=>{q.blur();open();};
  else{
    q.onclick=()=>open();
    q.onkeydown=e=>{
      if(["ArrowDown","ArrowUp","Enter"," "].includes(e.key)){e.preventDefault();open();}
      else if(e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();open(e.key);}  // a letter starts a search
    };
  }

}
// the picker for a searchBox. Phones: a panel up from the bottom with a title, a search bar (the
// keyboard opens only when it's tapped) and the list; a tap picks and closes it, so do the
// backdrop, × and the Android back button. anchor {el, input, typed} (mouse / keyboard): the same
// panel as a pop-up under anchor.el, the cursor in its search bar; Up/Down move, Enter picks,
// Esc, Tab or a click outside closes, and the focus goes back to anchor.input
function pickSheet(items,o,anchor){
  const find=o.find||o.text,c=o.cur(),under=openModalClose;   // a dialog it opened over keeps its back button
  const m=document.createElement("div");m.className=anchor?"popbg":"sheetbg";
  m.innerHTML=`<div class="sheet${anchor?" pop":""}" role="dialog" aria-label="Choose a ${esc(o.none)}">${anchor?"":`<div class="shead"><b>Choose a ${esc(o.none)}</b><button class="sx" aria-label="Close">×</button></div>`}
    ${anchor?'<div class="sqw"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>':""}<input class="sq" type="search" placeholder="Search" autocomplete="off" aria-label="Search">${anchor?"</div>":""}<div class="slist" role="listbox"></div></div>`;
  const sq=m.querySelector(".sq"),list=m.querySelector(".slist");
  const ADD={};   // o.add {text(typed), pick(typed)}: a last row that is always there (a new cartridge)
  let shown=[],at=-1;
  const mark=()=>list.querySelectorAll("[role=option]").forEach((r,i)=>r.classList.toggle("on",i===at));
  const draw=first=>{
    const words=sq.value.toLowerCase().split(/\s+/).filter(Boolean);
    shown=items.filter(x=>{const t=find(x).toLowerCase();return words.every(w=>t.includes(w));});
    const none=shown.length?"":`<div class="none">No ${o.none} matches “${esc(sq.value.trim())}”</div>`;
    if(o.add)shown.push(ADD);
    let last=null;
    list.innerHTML=(shown.length?shown.map((x,i)=>{
      if(x===ADD)return `<div role="option" class="sadd" aria-selected="false" data-i="${i}">${esc(o.add.text(sq.value.trim()))}</div>`;
      const h=o.head?o.head(x):null,top=h!==last?`<div class="hd">${esc(h)}</div>`:"";last=h;
      return `${top}<div role="option" class="${x===c?"cur":""}" aria-selected="${x===c}" data-i="${i}">${esc(o.text(x))}</div>`;}).join(""):"")+(o.add?"":none);
    if(o.add&&none)list.insertAdjacentHTML("afterbegin",none);
    if(anchor){at=shown.length?(first?Math.max(0,shown.indexOf(c)):0):-1;mark();}
  };
  const close=()=>{m.remove();document.body.style.overflow=under?"hidden":"";if(openModalClose===close)openModalClose=under;if(anchor)anchor.input.focus();};
  const choose=x=>{const t=sq.value.trim();close();if(x===ADD)o.add.pick(t);else o.pick(x);};
  if(anchor)sq.value=anchor.typed;
  draw(true);
  m.onclick=e=>{
    if(e.target===m||e.target.closest(".sx")){close();return;}
    const r=e.target.closest("[role=option]");if(!r)return;
    choose(shown[+r.dataset.i]);
  };
  sq.oninput=()=>draw(false);
  sq.onkeydown=e=>{
    if(anchor){
      const move=d=>{if(!shown.length)return;at=Math.min(shown.length-1,Math.max(0,at+d));mark();const on=list.querySelector(".on");if(on)on.scrollIntoView({block:"nearest"});};
      if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();move(e.key==="ArrowDown"?1:-1);}
      else if(e.key==="PageDown"||e.key==="PageUp"){e.preventDefault();move(e.key==="PageDown"?10:-10);}
      else if(e.key==="Enter"){e.preventDefault();if(shown[at])choose(shown[at]);}
      else if(e.key==="Escape"||e.key==="Tab"){e.preventDefault();e.stopPropagation();close();}
      return;
    }
    if(e.key==="Enter"){e.preventDefault();if(shown.length===1)choose(shown[0]);else sq.blur();}
  };
  if(anchor)list.onmousemove=e=>{const r=e.target.closest("[role=option]");if(r&&+r.dataset.i!==at){at=+r.dataset.i;mark();}};
  document.body.appendChild(m);document.body.style.overflow="hidden";openModalClose=close;
  // phones: the on-screen keyboard covers the bottom of the page without resizing it, so the
  // sheet follows the part still in view (visualViewport) and its search box stays above the keys
  const vv=!anchor&&window.visualViewport;
  if(vv){const fit=()=>{if(!m.isConnected){vv.removeEventListener("resize",fit);vv.removeEventListener("scroll",fit);return;}
      Object.assign(m.style,{top:vv.offsetTop+"px",height:vv.height+"px",bottom:"auto"});};
    vv.addEventListener("resize",fit);vv.addEventListener("scroll",fit);fit();}
  if(anchor){   // under the box (above it when there's no room), at least 320 px wide
    const sh=m.querySelector(".sheet"),r=anchor.el.getBoundingClientRect(),w=Math.min(innerWidth-16,Math.max(r.width,320));
    const below=innerHeight-r.bottom-12,above=r.top-12,up=below<260&&above>below;
    Object.assign(sh.style,{left:Math.max(8,Math.min(r.left,innerWidth-w-8))+"px",width:w+"px",maxHeight:Math.min(480,up?above:below)+"px"});
    if(up)sh.style.bottom=(innerHeight-r.top+4)+"px";else sh.style.top=(r.bottom+4)+"px";
    sq.focus();sq.setSelectionRange(sq.value.length,sq.value.length);
  }
  const cur=list.querySelector(anchor?".on":".cur");if(cur)cur.scrollIntoView({block:"center"});
}

// ---------- Head to Head tab ----------
// 2-5 loads side by side, from any cartridges of any category (the page's own category first).
// Each load keeps its Load Dictionary grade (against every load of its own cartridge), so the
// two tabs always agree. picked: [[category, load]]; groups: "title|cartridge" -> loads.
// a category's scoring weights as last set in its Load Dictionary (else the defaults)
function dictWeights(c){
  const w=(shared[c.title]||{}).w||{};
  return Object.fromEntries(MKEYS.map((k,i)=>{const v=parseFloat(w[k]);return [k,!isNaN(v)&&v>=0&&v<=10?v:c.weights[i]];}));
}
const h2hKeys=cats=>MKEYS.filter(k=>cats.some(c=>keysOf(c).includes(k)));
// guns: a gun weight per picked load, null (or a null in the list) for its cartridge's typical gun
// barrels: a barrel length per picked load (atBarrel: it and its cartridge's loads moved to it), null for the listed figures
// twists: a twist rate per picked load (atFirearm), null for none
function h2hRows(picked,dist,guns,weightsOf,priceOf,groups,barrels,twists){
  const done=new Map(),rows=[];
  for(const [n,[ic,it]] of picked.entries()){
    const gun=guns&&guns[n]!=null?guns[n]:typicalGun(ic,it.cartridge);
    const barrel=(barrels&&barrels[n])||0,twist=(twists&&twists[n])||0,grp=ic.title+"|"+it.cartridge,key=grp+"|"+gun+"|"+barrel+"|"+twist,d=Math.min(dist,ic.max_distance);
    if(!done.has(key)){
      const items=groups.get(grp).map(x=>atFirearm(x,ic,barrel,twist));
      done.set(key,new Map(scoreLoads(items,d,gun,weightsOf(ic),items.map(x=>priceOf(ic,x.base||x)),!ic.grain_style).map(r=>[r.it.base||r.it,r])));
    }
    const sr=done.get(key).get(it);
    rows.push(Object.assign({},sr,{cat:ic,dist:d,gun,keys:keysOf(ic).filter(k=>sr.st[k]!=null),best:new Set(),gap:{}}));   // no cost given: cost left out
  }
  for(const k of h2hKeys(rows.map(r=>r.cat))){
    const have=rows.filter(r=>r.keys.includes(k));if(!have.length)continue;const vals=have.map(r=>r.st[k]),lead=METRICS[k][1]?Math.max(...vals):Math.min(...vals);
    have.forEach((r,i)=>{if(Math.abs(vals[i]-lead)<=1e-9*Math.max(1,Math.abs(lead)))r.best.add(k);r.gap[k]=lead===0?0:100*(vals[i]-lead)/Math.abs(lead);});
  }
  return rows;
}
// a load picked more than once (the same load at two barrel lengths or gun weights): what sets
// each copy apart, "10.5 in barrel  ·  7 lb gun" (only what differs); "" for a load picked once (h2h_setups)
function h2hSetups(rows){
  const same=r=>rows.filter(x=>x.cat.title===r.cat.title&&(x.it.base||x.it)===(r.it.base||r.it));
  const barrel=r=>r.cat.barrel_in?`${g(r.it.at_in||testBarrel(r.cat,r.it))} in barrel`:"";
  return rows.map(r=>{const c=same(r),parts=[];
    if(c.length>1&&new Set(c.map(barrel)).size>1)parts.push(barrel(r));
    if(c.length>1&&new Set(c.map(x=>x.it.twist||0)).size>1)parts.push(r.it.twist?`1:${g(r.it.twist)} twist`:"no twist set");
    if(c.length>1&&new Set(c.map(x=>x.gun)).size>1)parts.push(`${g(r.gun)} lb gun`);
    return parts.filter(Boolean).join("  ·  ");});
}
// in the steps of the picked categories' widest table (rifle 100 yd, rimfire 50, handgun and
// shotgun 25); null past the load's own category's max distance; rows where every load is past it
// are left out
function h2hDownrange(picked){
  const base=picked.map(([c])=>c).reduce((a,c)=>c.step_yd>a.step_yd||(c.step_yd===a.step_yd&&c.max_distance>a.max_distance)?c:a),out=[];
  for(let n=0;n<6;n++){
    const yd=Math.min(n*base.step_yd,base.max_distance);if(out.length&&yd===out[out.length-1][0])break;

// how far behind the leader: "+45%", or "35x" once it is ten times or more (h2h_gap)

const H2HS={};   // what Head to Head had on screen when you left it (distance, gun weights)
function openH2H(pane){

  const H={};
  // slots: [{cat, cart, key}]: category title, cartridge, and the load's handload id or label

  const changed=()=>{save();render();};
  // phones: one card per load, then one card per factor with a bar per load, so nothing

  function phoneView(rows,dist,keys,most,badge,payload,setups){
    const name=r=>`<div class="mname${r.it.handload?" hl":""}">${esc(r.it.label)}${r.it.handload?" (handload)":""}${setups[rows.indexOf(r)]?` <span class="setup">${esc(setups[rows.indexOf(r)])}</span>`:""}</div>`;

let openModalClose=null;   // the open dialog's close(), for the Android back button
function modal(inner){
  const m=el(`<div class="modal"><div class="card">${inner}</div></div>`);
  document.body.appendChild(m);document.body.style.overflow="hidden";
  const close=()=>{m.remove();document.body.style.overflow="";if(openModalClose===close)openModalClose=null;};
  openModalClose=close;
  m.addEventListener("mousedown",e=>{if(e.target===m)close();});
  return [m,close];
}

$("#ver").textContent=VERSION_TEXT;
// start on the page the address names (a reload, or a link to #settings), else Home
{const [m,c,sub]=navFrom(history.state&&history.state.app?history.state:null);navigate(m,c,sub,"replace");}
syncSoon(0);   // pick up changes made on the other devices
// Android back button (Capacitor App plugin): close a dialog, then go back to the previous page
// (the same history the browser's back arrow uses); with no earlier page, step up the menus
// (category -> category list -> Home); only Home closes the app
(function(){
  const AppPlugin=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
  if(!AppPlugin||!AppPlugin.addListener)return;
  AppPlugin.addListener("backButton",()=>{
    if(openModalClose){openModalClose();return;}
    if(NAV.mode==="home")AppPlugin.exitApp();
    else if(history.state&&history.state.depth>0)history.back();
    else if(NAV.cat)navigate("loads",null,null,"replace");
    else if(NAV.mode==="ladder"&&NAV.sub)navigate("ladder",null,null,"replace");
    else if(NAV.mode!=="bench"&&BENCH_MODES.includes(NAV.mode))navigate("bench",null,null,"replace");
    else navigate("home",null,null,"replace");
  });
})();
