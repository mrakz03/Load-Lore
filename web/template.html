<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<title>In Like Flint - Load Lore</title>
<style>
:root{--bg:#0e1014;--surface:#171a21;--surface2:#222732;--border:#2d333f;--text:#e8eaee;--muted:#8a93a3;--accent:#4c8dff;--accent-h:#6aa0ff;--on-accent:#fff;--side:#12151b;--danger:#e5534b;--hand:#5fd1b4;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(16px * var(--ts,1))}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{font-size:1rem}
body{padding:max(16px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
.wrap{max-width:640px;margin:0 auto}
.main{min-width:0}
.wrap.wide{max-width:1000px}

.shell{max-width:1240px;margin:0 auto}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}
.brand b{display:block;font-size:1.05rem;letter-spacing:.01em}
.brand small{display:block;font-size:.72rem;font-weight:700;color:var(--muted);letter-spacing:.02em}
.brand .ver{font-size:.72rem;color:var(--muted);margin-top:2px}
.nav{display:flex;gap:4px}
.nav>button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-weight:700;font-size:.74rem;padding:7px 4px 6px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px}
.nav>button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav>button.on{color:var(--on-accent);background:var(--accent)}
.nav .sub{display:none}
.cmp{display:none;font-style:normal}
.side{display:contents}
.side .nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--side);border-top:1px solid var(--border);padding:6px 10px calc(6px + env(safe-area-inset-bottom));border-radius:14px 14px 0 0}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.phead{margin-bottom:12px}
.phead h2{margin:0}
.back{padding:0 0 6px;font-size:.88rem}
.hero{margin:4px 0 18px}
.hero h2{font-size:1.7rem;line-height:1.2;margin:0}
.hero h2 small{display:block;font-size:.95rem;color:var(--muted);letter-spacing:.02em}
.hero p{color:var(--muted);margin:8px 0 0;line-height:1.5}
.feat{display:grid;grid-template-columns:1fr;gap:12px}
.fcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:8px;text-align:left;color:var(--text);font:inherit;cursor:pointer}
.fcard:hover{border-color:var(--accent);background:var(--surface2)}
.fcard .ic{width:40px;height:40px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center}
.fcard .ic svg{width:22px;height:22px;stroke:var(--on-accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fcard b{font-size:1.15rem}.fcard span{color:var(--muted);font-size:.92rem;line-height:1.45}
.pick{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:560px){.feat,.pick{grid-template-columns:1fr 1fr}}
@media(min-width:900px){
  body{padding:0}
  .shell{display:grid;grid-template-columns:240px minmax(0,1fr);max-width:none;min-height:100vh}
  .side{display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;padding:22px 14px;background:var(--side);border-right:1px solid var(--border);overflow:auto}
  .side .brand{margin:0 6px}
  .side .brand b{font-size:1.3rem}
  .side .nav{position:static;flex:1;flex-direction:column;background:none;border:0;padding:0;gap:4px;border-radius:0}
  .nav>button[data-nav=settings]{margin-top:auto}   /* Settings sits at the bottom left */
  .nav>button{flex:none;flex-direction:row;justify-content:flex-start;align-items:center;gap:12px;font-size:.95rem;padding:11px 12px;min-height:0;text-align:left}
  .cmp{display:inline}
  .nav .sub{display:flex;flex-direction:column;gap:2px;margin:0 0 8px 24px;border-left:1px solid var(--border);padding-left:8px}
  .nav .sub button{background:none;border:0;color:var(--muted);font:inherit;font-size:.88rem;text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer}
  .nav .sub button:hover{background:var(--surface)}
  .nav .sub button.on{color:var(--text);background:var(--surface2);font-weight:700}
  .main{padding:26px 34px 48px;min-width:0}
  .wrap.wide{max-width:1040px}.wrap{margin:0}
  .wrap.home{max-width:760px}
}
.lgrid{align-items:start;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-top:12px}
@media(min-width:720px){.lgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.lc{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;cursor:pointer}
.lc.open{border-color:var(--accent)}
.lc .top{display:flex;gap:10px;align-items:flex-start}
.lc .rk{font-weight:800;color:var(--muted);min-width:2.2em;font-size:.9rem;padding-top:2px}
.lc .nm{flex:1;min-width:0;font-weight:700;line-height:1.3;word-break:break-word}
.lc .st{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0 0 calc(2.2em + 10px);font-size:.85rem;color:var(--muted)}
.lc .st b{color:var(--text);font-weight:600}
.lc .nm .wt{white-space:nowrap}
.lc .sc{text-align:right;white-space:nowrap}.lc .sc .n{font-size:.75rem;color:var(--muted);display:block;margin-top:2px}
.lc .det{margin:10px 0 0;border-top:1px solid var(--border);padding-top:8px}
.lc .det .row{padding:4px 0}
.chip{display:inline-block;font-size:.68rem;font-weight:700;color:var(--accent);border:1px solid var(--border);border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.prow{display:flex;gap:8px;align-items:center;margin-top:8px}.prow input{max-width:7.5em}
.prow .btn{padding:9px 12px;font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chips button{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:99px;padding:8px 13px;font:inherit;font-size:.85rem;font-weight:700;cursor:pointer;min-height:38px}
.chips button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chips button small{opacity:.75;font-weight:600;margin-left:3px}
.sortrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
@media(max-width:480px){.sortrow{grid-template-columns:1fr}}
.sortrow #ls{padding-top:8px;padding-bottom:8px;font-size:.9rem}

h1{font-size:1.45rem;margin:0}
h2{font-size:1.45rem;margin:6px 0 0}
.muted{color:var(--muted)}
.sub{color:var(--muted);margin:4px 0 18px;font-size:.95rem}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}
.cat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:left;color:var(--text);cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:6px;min-height:118px}
.cat:hover,.cat:active{background:var(--surface2);border-color:var(--accent)}
.cat b{font-size:1.1rem}.cat span.b{color:var(--muted);font-size:.85rem}.cat span.c{color:var(--accent);font-size:.78rem;font-weight:700;margin-top:auto}
.link{background:none;border:0;color:var(--accent);font:inherit;font-weight:700;font-size:.9rem;padding:6px 0;cursor:pointer}
.link.m{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
label.l{display:block;font-size:.7rem;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:0 0 5px}
select,input{width:100%;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:11px 10px;font:inherit;font-size:1rem;appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
select:focus,input:focus{outline:none;border-color:var(--accent)}
.field{margin-top:14px}.field:first-child{margin-top:0}
.nums>div,.three>div,.wrow>div{min-width:0}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.nums label.l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.links{display:flex;justify-content:space-between;margin-top:10px}
.weights{margin-top:8px}
.wrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(5.4em,1fr));gap:8px}
.wrow label{font-size:.8rem;color:var(--muted)}
.wnote{font-size:.8rem;font-weight:700;margin-top:8px}
.btns{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
button.btn{background:var(--surface2);color:var(--text);border:0;border-radius:8px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer}
button.btn:hover{background:var(--border)}
button.btn.p{background:var(--accent);color:var(--on-accent)}button.btn.p:hover{background:var(--accent-h)}
.hidden{display:none!important}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.size{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted)}
.size button{background:var(--surface2);color:var(--text);border:0;border-radius:6px;font:inherit;font-weight:800;min-width:40px;min-height:36px;cursor:pointer}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
@media(max-width:480px){.filters{grid-template-columns:1fr}}
.cnt{font-size:.8rem;color:var(--muted);margin-top:8px}
tbody tr{cursor:pointer}tbody tr:hover td{background:var(--surface2)}
.rank{font-size:.9rem;margin-top:8px;line-height:1.45}
.res{margin-top:16px}
.res h3{margin:0;font-size:1.05rem}
.row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;gap:10px}
.row .v{font-weight:700;margin-left:auto}
.badge{min-width:32px;text-align:center;border-radius:6px;font-weight:800;font-size:.85rem;padding:3px 6px}
hr{border:0;border-top:1px solid var(--border);margin:10px 0}
.bar{height:12px;background:var(--surface2);border-radius:6px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;border-radius:6px;transition:width .3s}
.note{font-size:.78rem;color:var(--muted);line-height:1.45;margin-top:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px;z-index:10}
.modal .card{width:100%;max-width:640px;margin:auto}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.help{font-size:.78rem;color:var(--muted);margin-top:4px;line-height:1.4}
.tblwrap .pc{display:none}
@media (max-width:600px){   /* phone: cartridge stacks over the load name; other figures are one tap away */
  .tblwrap .mn{display:none}
  .tblwrap .pc{display:block;font-size:.75rem;color:var(--muted)}
  .tblwrap .ld{white-space:normal;text-align:left}
}
.tblwrap{overflow:auto;margin-top:12px;border:1px solid var(--border);border-radius:8px;max-height:65vh}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{padding:8px 10px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--border)}
th{position:sticky;top:0;background:var(--surface2);cursor:pointer;font-size:.78rem}
td:nth-child(-n+2),th:nth-child(-n+2){text-align:left}
td:nth-child(1),th:nth-child(1){position:sticky;left:0;background:var(--surface)}
th:nth-child(1){background:var(--surface2);z-index:2}
.g2,.g3{display:grid;gap:8px;margin-top:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.g2>div,.g3>div{min-width:0}
@media(max-width:340px){.g3{grid-template-columns:1fr 1fr}}
.lc.hl{border-left:3px solid var(--accent)}
.hbtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.hbtns .btn{padding:9px 14px;font-size:.85rem}
.hbtns .btn.d{color:var(--danger)}
/* phone: a line under the app name, Home and the two menus sit a little lower */
@media(max-width:899px){
  .brand{border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:14px}
  #app.home,#app.picker{padding-top:7vh}
}
.setlist{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.setrow{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.setrow b{font-size:.98rem}.setrow .muted{font-size:.85rem}
.setrow select{max-width:220px}
.setrow.nw{flex-wrap:nowrap}.setrow.nw>div{flex:1;min-width:0}
.setrow .size{font-size:0}.setrow .size button{font-size:.95rem;min-width:52px;min-height:42px}
.safety{font-size:.78rem;color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-top:14px;line-height:1.4}
.costlbl{font-weight:700;margin-top:10px}
.links{align-items:center;gap:8px}.links .link.m{white-space:nowrap}
.lright{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:flex-end}
.tgl{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:99px;padding:6px 12px;font:inherit;font-size:.8rem;font-weight:700;cursor:pointer}
.tgl.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.slots{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.slot{display:grid;grid-template-columns:1.4em minmax(0,1fr) minmax(0,2fr) 2.2em;gap:8px;align-items:center}
.slot .n{font-weight:800;color:var(--muted)}
.slot .x{background:none;border:0;color:var(--muted);font:inherit;font-size:1.1rem;font-weight:700;cursor:pointer;min-height:40px}
.slot .x:hover{color:var(--text);background:var(--surface2)}
.slot .x{border-radius:8px;min-width:40px}.slot .x.gone{visibility:hidden}
@media(max-width:600px){.slot{grid-template-columns:1.4em minmax(0,1fr) 2.2em}.slot .ls{grid-column:2}}
.lsearch{position:relative;min-width:0}
.lsearch .lq{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px;text-overflow:ellipsis}
.lsearch .lq::-webkit-search-cancel-button{display:none}
.lsearch .lq:disabled{opacity:.6}
.lopts{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;max-height:min(50vh,360px);overflow-y:auto;background:var(--surface2);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.lopts [role=option]{padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--border)}
.lopts [role=option]:last-child{border-bottom:0}
.lopts [role=option].cur{font-weight:700}
.lopts [role=option].on,.lopts [role=option]:hover{background:var(--accent);color:var(--on-accent)}
.lopts .none{padding:10px 12px;color:var(--muted)}
.h2h{overflow:auto;margin-top:12px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
.h2h table{font-size:.9rem}
.h2h th,.h2h td{text-align:left;vertical-align:top;white-space:normal;padding:8px 12px}
.h2h th{position:static;cursor:default;background:var(--surface);font-size:.95rem}
.h2h td:first-child,.h2h th:first-child{position:sticky;left:0;background:var(--surface);color:var(--muted);font-weight:700;font-size:.82rem;min-width:7.5em;z-index:1}
.h2h th small{display:block;color:var(--muted);font-size:.72rem;font-weight:700}
.h2h th.hl{color:var(--hand)}
.h2h td.c{min-width:9.5em}
.h2h .v{font-weight:700}.h2h .best{color:var(--accent)}
.h2h .gap{font-size:.75rem;color:var(--muted);margin-left:6px}.h2h .gap.best{font-weight:700}
.h2h .badge{display:inline-block;margin-left:8px;min-width:24px;font-size:.75rem;padding:1px 5px}
.h2h tr.sep td{border-bottom:2px solid var(--border)}
details.btab{margin-top:10px}
details.btab summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:.9rem;padding:6px 0}
details.btab table th,details.btab table td{text-align:right;padding:7px 8px}
details.btab th small{display:block;font-weight:600;color:var(--muted)}
details.btab table td:first-child,details.btab table th:first-child{text-align:left;position:static}
.h2hm{display:none}
@media(max-width:600px){
  .h2hw{display:none}.h2hm{display:flex;flex-direction:column;gap:10px;margin-top:12px}
  .mload{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
  .mload.hl{border-left:3px solid var(--hand)}
  .mload .mi{flex:1;min-width:0}.mload small{display:block;color:var(--muted);font-size:.72rem;font-weight:700}
  .mload b{line-height:1.3;word-break:break-word}.mload .mf{font-size:.8rem;color:var(--muted);margin-top:3px}
  .mload .best{color:var(--accent);font-weight:700}
  .mload .mo{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;color:var(--muted)}
  .mload .mo .badge{margin:0}
  .mcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px}
  .mcard .mt{font-weight:800;display:flex;align-items:baseline;gap:6px;margin-bottom:4px}
  .mcard .mt small{color:var(--muted);font-weight:600;font-size:.78rem}.mcard .mt .hint{margin-left:auto;font-size:.7rem}
  .mrow{display:grid;grid-template-columns:1fr auto auto;column-gap:8px;row-gap:3px;align-items:center;padding:7px 0;border-top:1px solid var(--border)}
  .mt+.mrow,.mdr+.mrow{border-top:0}
  .mrow .mname{grid-column:1/4;font-size:.8rem;color:var(--muted);font-weight:600;line-height:1.3}
  .mrow .mname.hl{color:var(--hand)}
  .chips.mdr{margin:4px 0 6px}.chips.mdr button{min-height:32px;padding:5px 11px}
  .mrow .mv{font-weight:700}.mrow .best{color:var(--accent)}
  .mrow .mg{font-size:.75rem;color:var(--muted)}.mrow .mg.best{font-weight:700}
  .mrow .badge{min-width:26px;font-size:.75rem;padding:2px 5px}
  .mbar{grid-column:1/4;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
  .mbar i{display:block;height:100%;background:var(--muted);border-radius:3px}.mbar i.b{background:var(--accent)}
}
.sect{font-size:.7rem;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:18px 0 0}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><div><small>In Like Flint</small><b>Load Lore</b><div class="ver" id="ver"></div></div></div>
    <nav class="nav" id="nav" aria-label="Main"></nav>
  </aside>
  <main class="main">
    <div class="wrap" id="app"></div>
  </main>
</div>
<script>
"use strict";
const DATA = __DATA__;
const APP_TITLE = "In Like Flint - Load Lore";
// ---------- colour themes (same table as the desktop app) ----------
const THEMES = DATA.themes || {}, THEME_KEY = "cartridge_calc_theme";
const THEME_VARS = {bg:"--bg",surface:"--surface",surface_2:"--surface2",border:"--border",text:"--text",muted:"--muted",
  accent:"--accent",accent_hover:"--accent-h",on_accent:"--on-accent",side:"--side",danger:"--danger",hand:"--hand"};
let THEME = DATA.default_theme || "Classic";
try{const t=localStorage.getItem(THEME_KEY);if(t&&THEMES[t])THEME=t;}catch(e){}
function applyTheme(name){
  const t=THEMES[name];if(!t)return;THEME=name;
  const st=document.documentElement.style;
  for(const [k,v] of Object.entries(THEME_VARS))st.setProperty(v,t[k]);
  st.colorScheme=t.scheme;
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t.side;
  try{localStorage.setItem(THEME_KEY,name);}catch(e){}
}
applyTheme(THEME);
const VERSION_TEXT = DATA.version && DATA.version !== "dev" ? "Development Build v" + DATA.version : "Development Build";
const GRAINS_PER_OZ = 437.5;
const METRICS = {velocity:["Velocity",true],energy:["Energy",true],recoil:["Recoil",false],cost:["Cost",false],taylor:["Taylor KO",true],hits:["HITS",true]};
const TERMINAL=["taylor","hits"];

// ---------- ballistics ----------
function g1cd(m){
  if(m<=G1[0][0])return G1[0][1];
  const last=G1[G1.length-1]; if(m>=last[0])return last[1];
  let lo=0,hi=G1.length;                       // bisect_right
  while(lo<hi){const mid=(lo+hi)>>1; if(m<G1[mid][0])hi=mid; else lo=mid+1;}
  const [m0,c0]=G1[lo-1],[m1,c1]=G1[lo];
  return c0+(c1-c0)*(m-m0)/(m1-m0);
}
function velocityAt(fps,bc,distYd){
  if(distYd<=0)return +fps;
  let v=fps/FT_PER_M; const total=distYd/YD_PER_M, step=0.5; let x=0;
  const dvdx=s=>-KDRAG*g1cd(s/SOS)*s/bc;
  while(x<total && v>1){
    const h=Math.min(step,total-x), k1=dvdx(v), k2=dvdx(v+0.5*h*k1);
    v+=h*k2; x+=h;
  }
  return Math.max(v,0)*FT_PER_M;
}
const energy=(gr,v)=>gr*v*v/450240;
const GRAVITY=9.80665,IN_PER_M=39.37007874,WIND_MPH=10,MS_PER_MPH=0.44704;
// point-mass flight: G1 drag along the path plus gravity, RK2 steps of 0.5 m downrange (_fly)
function fly(fps,bc,y0,ang,marks){
  let v=fps/FT_PER_M,vx=v*Math.cos(ang),vy=v*Math.sin(ang),x=0,y=y0,t=0;const step=0.5,out=new Map([[0,[0,y0]]]);
  const d=(vx,vy)=>{const sp=Math.hypot(vx,vy),k=KDRAG*g1cd(sp/SOS)*sp/bc;return [-k,-(k*vy+GRAVITY)/vx,vy/vx,1/vx];};
  for(const m of [...new Set(marks)].sort((a,b)=>a-b)){
    while(x<m-1e-12&&vx>1){const h=Math.min(step,m-x),a=d(vx,vy),b=d(vx+0.5*h*a[0],vy+0.5*h*a[1]);vx+=h*b[0];vy+=h*b[1];y+=h*b[2];t+=h*b[3];x+=h;}
    if(vx<=1)break;
    out.set(m,[t,y]);
  }
  return out;
}
// [time s, path in] at each distance (trajectory in the desktop app), null past the stop point
function trajectory(fps,bc,sightIn,zeroYd,dists){
  const marks=dists.map(d=>d/YD_PER_M),zm=zeroYd/YD_PER_M,y0=-sightIn/IN_PER_M;let ang=0;
  for(let n=0;n<4;n++){const hit=fly(fps,bc,y0,ang,[zm]).get(zm);if(!hit)break;ang-=hit[1]/zm;}
  const f=fly(fps,bc,y0,ang,marks);
  return marks.map(m=>f.has(m)?[f.get(m)[0],f.get(m)[1]*IN_PER_M]:null);
}
// [yards, velocity, energy, path in, 10 mph drift in] out to 5 x step (ballistic_table in the desktop app)
function ballisticTable(it,cat){
  const yards=[];for(let n=0;n<6;n++){const yd=Math.min(n*cat.step_yd,cat.max_distance);if(yards.length&&yd===yards[yards.length-1])break;yards.push(yd);}
  const tr=trajectory(it.muzzle_fps,it.bc_g1,cat.sight_in,cat.zero_yd,yards),v0=it.muzzle_fps/FT_PER_M,rows=[];
  for(let i=0;i<yards.length;i++){
    const yd=yards[i];if(!tr[i])break;const [t,path]=tr[i];
    const v=velocityAt(it.muzzle_fps,it.bc_g1,yd);
    rows.push([yd,v,energy(it.bullet_gr,v),path,WIND_MPH*MS_PER_MPH*(t-(yd/YD_PER_M)/v0)*IN_PER_M]);
  }
  return rows;
}
function ballisticHTML(it,cat,open){
  return `<details class="btab"${open?" open":""}><summary>Ballistic table</summary><div class="tblwrap" style="max-height:none"><table><thead><tr><th>Yd</th><th>Velocity<small>fps</small></th><th>Energy<small>ft-lbs</small></th><th>Path<small>in</small></th><th>Wind<small>in</small></th></tr></thead><tbody>${
    ballisticTable(it,cat).map(([yd,v,e,p,w])=>`<tr><td>${g(yd)}</td><td>${Math.round(v).toLocaleString("en-US")}</td><td>${Math.round(e).toLocaleString("en-US")}</td><td>${Math.abs(p)<0.05?"0.0":(p>0?"+":"−")+Math.abs(p).toFixed(1)}</td><td>${w.toFixed(1)}</td></tr>`).join("")
  }</tbody></table></div><div class="note">Zeroed at ${g(cat.zero_yd)} yd with the sight ${g(cat.sight_in)} in above the bore; wind is a ${WIND_MPH} mph crosswind. Drop and drift are estimates from the G1 BC in sea-level air.</div></details>`;
}
function recoil(gr,fps,powder,gun){
  // standard free recoil: bullet + powder gas at ~4000 fps (GAS_FPS); no 1.75x gas factor
  const mom=(gr*fps+powder*4000)/7000, gv=mom/gun;
  return 0.5*(gun/32.174)*gv*gv;
}

// ---------- scoring ----------
function bulletDiameter(it){
  if(it.diameter_in)return it.diameter_in;
  const d=DIAMETERS[it.cartridge];if(d)return d;
  const n=it.cartridge.toLowerCase();if(n.includes("gauge")||n.includes("bore"))return 0;
  return Math.min(.6,Math.max(.17,Math.sqrt(it.bullet_gr/7000/.25)));
}
const taylorKO=(gr,v,d)=>gr*v*d/7000;
const hitsIndex=(gr,v,d)=>d<=0?0:(gr*gr/7000)*(v/(d*d))/100;
const hitsClass=h=>h<500?"small game":h<=900?"medium game":h<=1500?"large game":"dangerous game";
function computeStats(item,dist,gun,cost){
  const v=velocityAt(item.muzzle_fps,item.bc_g1,dist),d=bulletDiameter(item);
  return {weight:item.bullet_gr,velocity:v,energy:energy(item.bullet_gr,v),
          taylor:taylorKO(item.bullet_gr,v,d),hits:hitsIndex(item.bullet_gr,v,d),
          recoil:recoil(item.bullet_gr,item.muzzle_fps,item.powder_gr,gun),
          cost:cost==null?item.default_cost:cost};
}
function median(a){const s=[...a].sort((x,y)=>x-y),n=s.length;return n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2;}
function metricScore(value,ref,hi){
  if(ref<=0)return 50;
  const x=Math.max(value,0)/ref;
  return hi?100*(1-Math.exp(-HIGH_K*x)):100*Math.exp(-LOW_K*x);
}
// grade loads of one cartridge against each other (the Load Dictionary's grades; Head to Head
// shows the same ones). Shotshells (byType) are only graded against their own load type.
function scoreLoads(items,dist,gun,weights,costs,byType){
  const rows=items.map((it,i)=>({it,st:computeStats(it,dist,gun,costs[i]),group:byType?(it.group||""):""}));
  for(const key of new Set(rows.map(r=>r.group))){
    const rs=rows.filter(r=>r.group===key),res=relativeScores(rs.map(r=>r.st),weights);
    rs.forEach((r,i)=>{r.sc=res[i][0];r.overall=res[i][1];r.grade=gradeRel(r.overall);r.peers=rs.length;});
    [...rs].sort((a,b)=>b.overall-a.overall).forEach((r,i)=>r.rank=i+1);
  }
  return rows;
}
function gradeRel(score){for(const [t,l] of REL_BANDS)if(score>=t)return l;return "F";}
function spread(vals){
  const n=vals.length; let mid=median(vals);
  let scale=1.4826*median(vals.map(v=>Math.abs(v-mid)));
  if(scale<1e-9){
    const mean=vals.reduce((a,b)=>a+b,0)/n;
    scale=n>1?Math.sqrt(vals.reduce((a,v)=>a+(v-mean)*(v-mean),0)/n):0; mid=mean;
  }
  if(scale<1e-9)return vals.map(()=>REL_CENTER);
  return vals.map(v=>Math.min(100,Math.max(0,REL_CENTER+REL_SPREAD*(v-mid)/scale)));
}
function relativeScores(statsList,weights){
  if(!statsList.length)return [];
  const refs={},per={};
  for(const k of MKEYS)refs[k]=median(statsList.map(s=>s[k]));
  for(const k of MKEYS)per[k]=spread(statsList.map(s=>metricScore(s[k],refs[k],METRICS[k][1])));
  let w=weights,tot=MKEYS.reduce((a,k)=>a+w[k],0);
  if(tot<=0){w=Object.fromEntries(MKEYS.map(k=>[k,1]));tot=MKEYS.length;}
  const raw=statsList.map((_,i)=>MKEYS.reduce((a,k)=>a+per[k][i]*w[k],0)/tot);
  const overall=spread(raw);
  return statsList.map((_,i)=>[Object.fromEntries(MKEYS.map(k=>[k,per[k][i]])),overall[i]]);
}

  return it.load||g(it.bullet_gr)+" gr";
}

function readPrices(){try{const o=JSON.parse(localStorage.getItem(PRICE_KEY)||"{}")||{},out={};for(const [k,v] of Object.entries(o)){const p=k.split("|");if(p.length<3){out[k]=v;continue;}const r=p.slice(2).join("|"),m=/^(\d+(?:\.\d+)?) gr  ·  (.+)$/.exec(r),n=RENAMED[p[1]]||p[1];for(const c of SPLIT[n]||[n])out[`${p[0]}|${c}|${m?`${m[2]}  ·  ${m[1]} gr`:r}`]=v;}return out;}catch(e){return {};}}
function writePrices(o){try{localStorage.setItem(PRICE_KEY,JSON.stringify(o));return true;}catch(e){return false;}}
const priceKey=(cat,it)=>`${cat.title}|${it.cartridge}|${it.label}`;
const shared={};   // category title -> values carried between the two tabs
// ammo_*.csv cartridges with no factory loads (e.g. .32-40) still get an empty entry, after the
// cartridge they follow there, so handloaders can use the Load Dictionary for them
function withHandloadOnly(groups,cartLoads){
  const order=[...new Set(cartLoads.map(x=>x.cartridge))];
  if(order.every(c=>groups.has(c)))return groups;
  let keys=[...groups.keys()];
  order.forEach((c,i)=>{if(keys.includes(c))return;const prev=order.slice(0,i).reverse().find(p=>keys.includes(p));const at=prev?keys.indexOf(prev)+1:0;keys.splice(at,0,c);});
  return new Map(keys.map(k=>[k,groups.get(k)||[]]));
}
function groupBy(loads,sort){
  const m=new Map();
  for(const it of loads){if(!m.has(it.cartridge))m.set(it.cartridge,[]);m.get(it.cartridge).push(it);}
  if(sort)for(const a of m.values())a.sort((x,y)=>x.bullet_gr-y.bullet_gr||(x.load<y.load?-1:x.load>y.load?1:0));
  return m;
}

function readHand(){try{return canonRows(JSON.parse(localStorage.getItem(HAND_KEY)||"[]"));}catch(e){return [];}}
function writeHand(a){try{localStorage.setItem(HAND_KEY,JSON.stringify(a));return true;}catch(e){return false;}}
function handItem(r,cat){
  const it={cartridge:r.cartridge,load:r.name,bullet_gr:+r.bullet_gr,muzzle_fps:+r.muzzle_fps,bc_g1:+r.bc_g1,powder_gr:+r.powder_gr,
    default_cost:+r.cost,source:"handload",group:"",is_default:false,barrel_in:+r.barrel_in||0,purpose:r.purpose||"",
    diameter_in:+r.diameter_in||0,handload:true,hid:r.id,rec:r};
  it.label=makeLabel(it,cat);return it;
}
// keep state.detail[cat] = factory loads + the user's handloads (same array object, edited in place)
function syncHand(cat){
  const arr=state.detail[cat.title];
  for(let i=arr.length-1;i>=0;i--)if(arr[i].handload)arr.splice(i,1);
  if(!cat.grain_style)return;
  const seen=new Set(arr.map(x=>x.cartridge+"|"+x.label));
  for(const r of readHand()){
    if(r.category!==cat.title)continue;
    const it=handItem(r,cat);let base=it.label,n=1;
    while(seen.has(it.cartridge+"|"+it.label)){n++;it.label=`${base} (${n})`;}
    seen.add(it.cartridge+"|"+it.label);arr.push(it);
  }
}
const costParts=r=>{
  const b=+r.bullet_cost||0,p=(+r.powder_gr||0)/7000*(+r.powder_cost_lb||0),pr=+r.primer_cost||0,br=(+r.brass_cost||0)/Math.max(1,+r.brass_reuse||1);

};

          ${cat.terminal?`<div class="row"><span class="muted">Taylor KO</span><span class="v">${r.st.taylor.toFixed(1)}</span>${fb("taylor")}</div>
          <div class="row"><span class="muted">HITS</span><span class="v">${r.st.hits.toFixed(0)} <small class="muted">(${hitsClass(r.st.hits)})</small></span>${fb("hits")}</div>`:""}
          <div class="muted" style="font-size:.8rem;margin-top:4px">${GRADES?`Overall ${r.grade} · ${r.overall.toFixed(0)} · r`:"R"}anks #${r.rank} of ${r.peers}${out.multi?" "+esc(it.group)+" loads":" "+esc(it.cartridge)+" loads"}.${GRADES?" Grades compare loads of this cartridge only.":""}</div>
          ${ballisticHTML(it,cat,L.btOpen)}
          <div class="hbtns"><button class="btn h2hb">${h2hText(cat,it)}</button></div>
          ${it.handload?`<div class="hbtns"><button class="btn p hedit">Edit</button><button class="btn hdup">Duplicate</button><button class="btn d hdel">Delete</button></div>
          <div class="note">${esc(SOURCE_NOTES.handload)}</div></div>`:`<div class="prow"><span class="muted" style="font-size:.85rem">Your price $</span><input class="pin" inputmode="decimal" value="${r.st.cost.toFixed(2)}" aria-label="Your price per round"><button class="btn p setp">Set</button>${edited?`<button class="btn clrp">Use estimate</button>`:""}</div>
          <div class="note">${esc(SOURCE_NOTES[it.source]||DEFAULT_SOURCE_NOTE)} Catalog price estimate: $${it.default_cost.toFixed(2)}.</div></div>`}`:""}
      </div>`;}).join("")||`<div class="muted">No loads match that filter.</div>`;
    box.querySelectorAll(".lc").forEach(c=>{
      const lab=c.dataset.i;
      c.onclick=e=>{if(e.target.closest(".prow,.hbtns,.btab"))return;L.open=L.open===lab?null:lab;render();};
      const it=all.find(x=>keyOf(x)===lab&&x.cartridge===$$("#lc").value);
      const bt=c.querySelector("details.btab");
      if(bt){bt.addEventListener("toggle",()=>{L.btOpen=bt.open;});bt.onclick=e=>e.stopPropagation();}
      const hb=c.querySelector(".h2hb");
      if(hb&&it)hb.onclick=()=>{
        const picks=H2H[cat.title]=H2H[cat.title]||[];
        if(picks.includes(pickKey(it))||picks.length>=H2H_MAX){navigate("h2h",cat);return;}
        picks.push(pickKey(it));hb.textContent=h2hText(cat,it);
      };
      if(it&&it.handload){
        if(!c.querySelector(".hedit"))return;
        c.querySelector(".hedit").onclick=()=>openHand(it.rec);
        c.querySelector(".hdup").onclick=()=>{const rows=readHand(),n=Object.assign({},it.rec,{id:"h"+Date.now()+Math.random().toString(36).slice(2,6),name:it.rec.name+" (copy)"});rows.push(n);writeHand(rows);afterHand(n);};
        c.querySelector(".hdel").onclick=()=>{if(!confirm(`Delete "${it.rec.name}"?`))return;writeHand(readHand().filter(x=>x.id!==it.rec.id));L.open=null;afterHand(null);};
        return;
      }
      const sp=c.querySelector(".setp"),cl=c.querySelector(".clrp");
      if(sp)sp.onclick=()=>{const v=parseFloat(c.querySelector(".pin").value);if(!(v>=0)){alert("Enter a price, e.g. 0.45");return;}L.prices[priceKey(cat,it)]=v;writePrices(L.prices);render();};
      if(cl)cl.onclick=()=>{delete L.prices[priceKey(cat,it)];writePrices(L.prices);render();};
    });
    $$("#lnote").textContent=(GRADES?`Grades compare loads of this cartridge${L.purpose!=="All"?" and purpose ("+L.purpose+")":""}; the average scores about ${REL_CENTER}. `:"")+"Prices are estimates.";
  }
  function openHand(rec){
    const cl=[...new Set([...carts,...state.loads[cat.title].map(x=>x.cartridge)])];
    handDialog(cat,rec||{cartridge:$$("#lc").value},cl,afterHand);
  }
  function afterHand(r){
    const cur0=$$("#lc").value;syncHand(cat);regroup();fillCarts();$$("#lc").value=groups.has(cur0)?cur0:(groups.has(biggest)?biggest:carts[0]);
    if(r){const cur=r.cartridge;$$("#lc").value=cur;L.purpose="All";L.src="All";const it=all.find(x=>x.hid===r.id);L.open=it?keyOf(it):null;}
    
    buildChips();render();
  }
  if(cat.grain_style)$$("#hadd").onclick=()=>openHand(null);
  $$("#lc").onchange=()=>{L.open=null;buildChips();render();};
  ["#ld","#lg","#lf"].concat(MKEYS.map(k=>"#lw_"+k)).forEach(id=>$$(id).addEventListener("input",render));
  $$("#ls").onchange=render;
  $$("#lwt").onclick=()=>{L.weightsOpen=!L.weightsOpen;$$("#lwb").classList.toggle("hidden",!L.weightsOpen);$$("#lwt").innerHTML=(L.weightsOpen?"▾":"▸")+"&nbsp; Scoring weights";};
  buildChips();render();
}

// ---------- Head to Head tab ----------
// 2-5 loads side by side, from any cartridges of the category. Each load keeps its Load
// Dictionary grade (against every load of its own cartridge), so the two tabs always agree.
function h2hRows(cat,picked,dist,gun,weights,priceOf,groups){
  const done=new Map(),rows=[];
  for(const it of picked){
    if(!done.has(it.cartridge)){const items=groups.get(it.cartridge);done.set(it.cartridge,new Map(scoreLoads(items,dist,gun,weights,items.map(priceOf),!cat.grain_style).map(r=>[r.it,r])));}
    rows.push(Object.assign({},done.get(it.cartridge).get(it),{best:new Set(),gap:{}}));
  }
  for(const k of keysOf(cat)){
    const vals=rows.map(r=>r.st[k]),lead=METRICS[k][1]?Math.max(...vals):Math.min(...vals);
    rows.forEach((r,i)=>{if(Math.abs(vals[i]-lead)<=1e-9*Math.max(1,Math.abs(lead)))r.best.add(k);r.gap[k]=lead===0?0:100*(vals[i]-lead)/Math.abs(lead);});
  }
  return rows;
}
function h2hDownrange(cat,items){
  const out=[];
  for(let n=0;n<6;n++){
    const yd=Math.min(n*cat.step_yd,cat.max_distance);if(out.length&&yd===out[out.length-1][0])break;
    out.push([yd,items.map(it=>{const v=velocityAt(it.muzzle_fps,it.bc_g1,yd);return [v,energy(it.bullet_gr,v)];})]);
  }
  return out;
}
const fmt0=v=>Math.round(v).toLocaleString("en-US");
const h2hValue=(k,v)=>({velocity:`${fmt0(v)} fps`,energy:`${fmt0(v)} ft-lbs`,recoil:`${v.toFixed(1)} ft-lbs`,cost:`$${v.toFixed(2)}`,taylor:v.toFixed(1),hits:`${v.toFixed(0)} (${hitsClass(v)})`})[k];
function openH2H(cat,pane){
  syncHand(cat);
  const groups=new Map([...groupBy(state.detail[cat.title],true)].filter(([,v])=>v.length)),carts=[...groups.keys()];
  const choice=(c,key)=>(groups.get(c)||[]).find(x=>(x.hid||x.label)===key);
  const sh=shared[cat.title]||{},prices=readPrices();
  const priceOf=it=>{const v=prices[priceKey(cat,it)];return typeof v==="number"?v:it.default_cost;};
  const H={weightsOpen:false};
  // slots: [{cart, key}] where key is the load's handload id or label
  let slots=(H2H[cat.title]||[]).map(k=>{const i=k.indexOf("|");return {cart:k.slice(0,i),key:k.slice(i+1)};}).filter(s=>choice(s.cart,s.key)).slice(0,H2H_MAX);
  const blank=()=>({cart:slots.length?slots[slots.length-1].cart:(sh.cart&&groups.has(sh.cart)?sh.cart:""),key:""});
  while(slots.length<H2H_MIN)slots.push(blank());
  pane.innerHTML=`<div class="card">
    <label class="l">LOADS TO COMPARE</label><div class="slots" id="hs"></div>
    <button class="link" id="hadd2">+&nbsp; Add a load (up to ${H2H_MAX})</button>
    <div class="nums" style="grid-template-columns:1fr 1fr">
      <div><label class="l">DISTANCE (YD)</label><input id="hd" inputmode="decimal"></div>
      <div><label class="l">${esc(cat.gun_label)}</label><input id="hg" inputmode="decimal"></div>
    </div>
    <div class="links"><button class="link m" id="hwt">▸&nbsp; Scoring weights</button></div>
    <div class="weights hidden" id="hwb"><div class="wrow">${MKEYS.map(k=>`<div class="${keysOf(cat).includes(k)?"":"hidden"}"><label>${METRICS[k][0]}</label><input id="hw_${k}" inputmode="numeric"></div>`).join("")}</div>
      <div class="help">Higher = matters more. 0 ignores that factor.</div></div>
  </div>
  <div id="hres"></div><div class="note" id="hnote"></div>`;
  const $$=s=>$(s,pane);
  $$("#hd").value=sh.dist!=null?sh.dist:g(cat.default_distance);
  $$("#hg").value=sh.gun!=null?sh.gun:g(cat.default_gun_lb);
  MKEYS.forEach((k,i)=>$$("#hw_"+k).value=sh.w?sh.w[k]:cat.weights[i]);
  app._leave=()=>{shared[cat.title]=Object.assign({},shared[cat.title],{dist:$$("#hd").value,gun:$$("#hg").value,w:Object.fromEntries(MKEYS.map(k=>[k,$$("#hw_"+k).value]))});};
  const picked=()=>{const out=[];for(const s of slots){const it=choice(s.cart,s.key);if(it&&!out.includes(it))out.push(it);}return out;};
  const save=()=>{H2H[cat.title]=picked().map(pickKey);};
  // the load box is a search (issue #24): every typed word must be in the name, the list
  // shows the matches, arrows + Enter or a tap pick one; leaving the box keeps the old pick
  const optText=x=>x?x.label+(x.handload?" (handload)":""):"";
  function loadSearch(box,items,key,pick){
    const q=box.querySelector(".lq"),list=box.querySelector(".lopts"),cur=items.find(x=>(x.hid||x.label)===key);
    let shown=[],at=0;
    const open=all=>{
      const words=all?[]:q.value.toLowerCase().split(/\s+/).filter(Boolean);
      shown=items.filter(x=>{const t=optText(x).toLowerCase();return words.every(w=>t.includes(w));});
      at=Math.max(0,shown.indexOf(cur));
      list.innerHTML=shown.length?shown.map((x,i)=>`<div role="option" class="${i===at?"on":""}${x===cur?" cur":""}" data-i="${i}">${esc(optText(x))}</div>`).join(""):`<div class="none">No load matches “${esc(q.value.trim())}”</div>`;
      list.classList.remove("hidden");q.setAttribute("aria-expanded","true");
      const on=list.querySelector(".on");if(on)on.scrollIntoView({block:"nearest"});
    };
    const close=()=>{list.classList.add("hidden");q.setAttribute("aria-expanded","false");};
    const move=d=>{if(!shown.length)return;at=(at+d+shown.length)%shown.length;list.querySelectorAll("[role=option]").forEach((o,i)=>o.classList.toggle("on",i===at));list.querySelector(".on").scrollIntoView({block:"nearest"});};
    const choose=i=>{const x=shown[i];if(!x)return;close();q.value=optText(x);pick(x.hid||x.label);};
    q.onfocus=()=>{q.select();open(true);};
    q.oninput=()=>open(!q.value.trim());
    q.onkeydown=e=>{
      if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(list.classList.contains("hidden"))open(q.value===optText(cur));else move(e.key==="ArrowDown"?1:-1);}
      else if(e.key==="Enter"){e.preventDefault();if(!list.classList.contains("hidden"))choose(at);}
      else if(e.key==="Escape"){if(!list.classList.contains("hidden")){e.preventDefault();e.stopPropagation();}close();q.value=optText(cur);}
    };
    q.onblur=()=>{close();q.value=optText(cur);};
    // mousedown, not click: the box must keep focus until the pick is made
    list.onmousedown=e=>{e.preventDefault();const o=e.target.closest("[role=option]");if(o)choose(+o.dataset.i);};
  }
  function drawSlots(){
    $$("#hs").innerHTML=slots.map((s,i)=>`<div class="slot" data-i="${i}"><span class="n">${i+1}</span>
      <select class="cs" aria-label="Cartridge ${i+1}"><option value="" disabled ${s.cart?"":"selected"} hidden>Cartridge…</option>${carts.map(c=>`<option value="${esc(c)}" ${c===s.cart?"selected":""}>${esc(c)}</option>`).join("")}</select>
      <div class="ls lsearch"><input class="lq" type="search" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-label="Load ${i+1}: type to search" placeholder="${s.cart?"Load… type to search":"Pick a cartridge first"}" autocomplete="off" value="${esc(optText(choice(s.cart,s.key)))}"${s.cart?"":" disabled"}><div class="lopts hidden" role="listbox"></div></div>
      <button class="x${slots.length<=H2H_MIN&&!s.key?" gone":""}" aria-label="Remove load ${i+1}">✕</button></div>`).join("");
    $$("#hs").querySelectorAll(".slot").forEach(row=>{
      const s=slots[+row.dataset.i];
      row.querySelector(".cs").onchange=e=>{s.cart=e.target.value;s.key="";drawSlots();changed();};
      loadSearch(row.querySelector(".lsearch"),groups.get(s.cart)||[],s.key,k=>{s.key=k;drawSlots();changed();});
      // ✕ removes the row; with only the 2 rows left it clears the load instead (issue #16)
      row.querySelector(".x").onclick=()=>{if(slots.length<=H2H_MIN)s.key="";else slots.splice(slots.indexOf(s),1);drawSlots();changed();};
    });
    $$("#hadd2").classList.toggle("hidden",slots.length>=H2H_MAX);
  }
  const changed=()=>{save();render();};
  // phones: one card per load, then one card per factor with a bar per load, so nothing
  // has to be read across a wide table
  function phoneView(rows,dist,keys,most,badge,payload){
    const name=r=>`<div class="mname${r.it.handload?" hl":""}">${esc(r.it.label)}${r.it.handload?" (handload)":""}</div>`;
    let h=`<div class="h2hm">`+rows.map(r=>`<div class="mload${r.it.handload?" hl":""}"><div class="mi">
      <small>${esc(r.it.cartridge)}</small><b>${esc(r.it.label)}</b>${r.it.handload?' <span class="chip">Handload</span>':""}
      <div class="mf">${esc([payload(r.it),cat.grain_style&&r.it.barrel_in?g(r.it.barrel_in)+" in barrel":"",r.it.purpose||r.it.group||""].filter(Boolean).join(" · "))}</div>
      <div class="mf">Rank #${r.rank} of ${r.peers} ${r.group?esc(r.group)+" ":""}loads · <span class="${r.best.size===most&&most?"best":""}">best in ${r.best.size} of ${keys.length}</span></div></div>
      ${GRADES?`<div class="mo">${badge(r.grade,true)}<span>${r.overall.toFixed(0)}</span></div>`:""}</div>`).join("");
    const bar=(w,b)=>`<div class="mbar"><i class="${b?"b":""}" style="width:${Math.max(3,Math.min(100,100*w)).toFixed(1)}%"></i></div>`;
    for(const k of keys){
      const hi=METRICS[k][1],vals=rows.map(r=>r.st[k]),top=Math.max(...vals),low=Math.min(...vals);
      h+=`<div class="mcard"><div class="mt">${METRICS[k][0]}${k==="velocity"||k==="energy"?` <small>at ${g(dist)} yd</small>`:""}<small class="hint">${hi?"higher is better":"lower is better"}</small></div>`+
        rows.map(r=>{const b=r.best.has(k),v=r.st[k],w=hi?(top>0?v/top:0):(v>0?low/v:1);
          return `<div class="mrow">${name(r)}<span class="mv${b?" best":""}">${h2hValue(k,v)}</span><span class="mg${b?" best":""}">${b?"best":(r.gap[k]>=0?"+":"−")+Math.abs(r.gap[k]).toFixed(0)+"%"}</span>${GRADES?badge(gradeRel(r.sc[k])):"<span></span>"}${bar(w,b)}</div>`;}).join("")+`</div>`;
    }
    // downrange: pick a distance, then the same bubble rows with names
    const dr=h2hDownrange(cat,rows.map(r=>r.it));
    if(H.drYd==null||!dr.some(([yd])=>yd===H.drYd))H.drYd=dr[Math.min(dr.length-1,2)][0];
    const at=dr.find(([yd])=>yd===H.drYd)[1],eTop=Math.max(...at.map(c=>c[1]));
    h+=`<div class="mcard"><div class="mt">Downrange<small class="hint">velocity · energy</small></div>
      <div class="chips mdr" role="group" aria-label="Distance">${dr.map(([yd])=>`<button data-yd="${yd}" class="${yd===H.drYd?"on":""}">${g(yd)} yd</button>`).join("")}</div>`+
      rows.map((r,i)=>{const [v,e]=at[i],b=e>=eTop-1e-9;
        return `<div class="mrow">${name(r)}<span class="mv${b?" best":""}">${fmt0(v)} fps</span><span class="mg${b?" best":""}">${fmt0(e)} ft-lbs</span><span></span>${bar(eTop>0?e/eTop:0,b)}</div>`;}).join("")+`</div>`;
    return h+`</div>`;
  }
  function render(){
    const box=$$("#hres");
    const dist=parseFloat($$("#hd").value),gun=parseFloat($$("#hg").value),weights={};let bad=false;
    for(const k of MKEYS){const v=parseFloat($$("#hw_"+k).value);if(isNaN(v)||v<0||v>10)bad=true;weights[k]=v;}
    $$("#hnote").textContent=(GRADES?`Each grade is the load's Load Dictionary grade: against every load of its own cartridge${cat.grain_style?"":" and load type"}, not against the others here. `:"")+"The best figure in each row is highlighted; the % shows how far the others are behind it. Prices are estimates: set your own in the Load Dictionary.";
    if(isNaN(dist)||dist<0||dist>cat.max_distance||isNaN(gun)||gun<.5||gun>30||bad){box.innerHTML=`<div class="cnt">Enter a distance (0–${g(cat.max_distance)}), gun weight (0.5–30) and weights (0–10) to see results.</div>`;return;}
    const pk=picked();
    if(pk.length<H2H_MIN){box.innerHTML=`<div class="cnt">Pick at least ${H2H_MIN} loads to put them head to head.</div>`;return;}
    const rows=h2hRows(cat,pk,dist,gun,weights,priceOf,groups),keys=keysOf(cat);
    const badge=(gr,big)=>`<span class="badge" style="background:${GRADE_COLORS[gr][0]};color:${GRADE_COLORS[gr][1]}${big?";margin-left:0;font-size:.95rem;padding:3px 8px":""}">${gr}</span>`;
    const line=(name,cells,cls)=>`<tr${cls?` class="${cls}"`:""}><td>${name}</td>${cells.map(c=>`<td class="c">${c}</td>`).join("")}</tr>`;
    const payload=it=>cat.show_oz?`${it.bullet_gr.toFixed(0)} gr (${(it.bullet_gr/GRAINS_PER_OZ).toFixed(2)} oz)`:`${g(it.bullet_gr)} gr`;
    const most=Math.max(...rows.map(r=>r.best.size));
    let h=`<div class="h2hw"><div class="h2h"><table><thead><tr><th></th>${rows.map(r=>`<th class="${r.it.handload?"hl":""}"><small>${esc(r.it.cartridge)}</small>${esc(r.it.label)}${r.it.handload?" <small>handload</small>":""}</th>`).join("")}</tr></thead><tbody>`;
    if(GRADES)h+=line("Overall",rows.map(r=>`${badge(r.grade,true)} <span class="v" style="margin-left:6px">${r.overall.toFixed(0)}</span>`));
    h+=line("Rank in its cartridge",rows.map(r=>`#${r.rank} of ${r.peers} ${r.group?esc(r.group)+" ":""}loads`),"sep");
    h+=line(esc(cat.payload_row),rows.map(r=>payload(r.it)));
    if(cat.grain_style)h+=line("Test barrel",rows.map(r=>r.it.barrel_in?g(r.it.barrel_in)+" in":"not listed"));
    h+=line("Purpose",rows.map(r=>esc(r.it.purpose||r.it.group||"—")));
    for(const k of keys){
      h+=line(METRICS[k][0]+(k==="velocity"||k==="energy"?` at ${g(dist)} yd`:""),rows.map(r=>{const b=r.best.has(k);
        return `<span class="v${b?" best":""}">${h2hValue(k,r.st[k])}</span><span class="gap${b?" best":""}">${b?"best":(r.gap[k]>=0?"+":"−")+Math.abs(r.gap[k]).toFixed(0)+"%"}</span>${GRADES?badge(gradeRel(r.sc[k])):""}`;}));
    }
    h+=line("Best in",rows.map(r=>`<span class="${r.best.size===most&&most?"v best":""}">${r.best.size} of ${keys.length}</span>`));
    h+=`</tbody></table></div><div class="sect">DOWNRANGE · velocity (fps) and energy (ft-lbs)</div><div class="h2h"><table><thead><tr><th>Yards</th>${rows.map(r=>`<th style="font-size:.8rem;color:var(--muted)">${esc(r.it.label)}</th>`).join("")}</tr></thead><tbody>`;
    for(const [yd,cells] of h2hDownrange(cat,pk)){
      const top=Math.max(...cells.map(c=>c[1]));
      h+=`<tr><td>${g(yd)}</td>${cells.map(([v,e])=>`<td class="c${e>=top-1e-9?" v best":""}">${fmt0(v)} · ${fmt0(e)}</td>`).join("")}</tr>`;
    }
    box.innerHTML=h+`</tbody></table></div></div>`+phoneView(rows,dist,keys,most,badge,payload);
    box.querySelectorAll("[data-yd]").forEach(c=>c.onclick=()=>{H.drYd=+c.dataset.yd;render();});
  }
  drawSlots();save();
  $$("#hadd2").onclick=()=>{if(slots.length>=H2H_MAX)return;slots.push(blank());drawSlots();const r=$$("#hs").lastElementChild;r.querySelector(r.querySelector(".cs").value?".ls":".cs").focus();};
  ["#hd","#hg"].concat(MKEYS.map(k=>"#hw_"+k)).forEach(id=>$$(id).addEventListener("input",render));
  $$("#hwt").onclick=()=>{H.weightsOpen=!H.weightsOpen;$$("#hwb").classList.toggle("hidden",!H.weightsOpen);$$("#hwt").innerHTML=(H.weightsOpen?"▾":"▸")+"&nbsp; Scoring weights";};
  render();
}

let openModalClose=null;   // the open dialog's close(), for the Android back button
function modal(inner){
  const m=el(`<div class="modal"><div class="card">${inner}</div></div>`);
  document.body.appendChild(m);document.body.style.overflow="hidden";
  const close=()=>{m.remove();document.body.style.overflow="";if(openModalClose===close)openModalClose=null;};
  openModalClose=close;
  m.addEventListener("mousedown",e=>{if(e.target===m)close();});
  return [m,close];
}

$("#ver").textContent=VERSION_TEXT;
navigate("home");
// Android back button (Capacitor App plugin): close a dialog, then step back up the menus
// (category -> category list -> Home); only Home closes the app
(function(){
  const AppPlugin=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
  if(!AppPlugin||!AppPlugin.addListener)return;
  AppPlugin.addListener("backButton",()=>{
    if(openModalClose){openModalClose();return;}
    if(NAV.cat)navigate(NAV.mode);
    else if(NAV.mode!=="home")navigate("home");
    else AppPlugin.exitApp();
  });
})();
